services:
  - type: web
    name: daan-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL   # Postgres connection string (Neon/Supabase); without it data is lost on restart
        sync: false
      - key: REPORT_PHOTO   # 1 = require a live photo when reporting (on-device check); 0/unset = off
        value: "0"
      - key: STATS_TOKEN    # secret for /stats?token=... (analytics dashboard)
        sync: false
      - key: GOOGLE_MAPS_KEY   # Maps JavaScript API browser key (restrict by HTTP referrer); empty = Google-styled OpenFreeMap
        sync: false
      - key: TOMTOM_KEY     # TomTom key: live-traffic routes + place search
        sync: false
      - key: ORS_KEY        # free OpenRouteService key; enter it in Render → Environment
        sync: false
