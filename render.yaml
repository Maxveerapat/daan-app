services:
  - type: web
    name: daan-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TOMTOM_KEY     # TomTom key: live-traffic routes + place search
        sync: false
      - key: ORS_KEY        # free OpenRouteService key; enter it in Render → Environment
        sync: false
