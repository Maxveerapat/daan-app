<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ด่าน — แจ้งเตือนด่านตรวจ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #0B0B0F;
    --surface: #16171C;
    --surface-2: #1F2027;
    --text: #F5F5F7;
    --muted: #93939C;
    --hair: rgba(255,255,255,.09);
    --accent: #FF453A;
    --blue: #0A84FF;
    --green: #30D158;
    --amber: #FF9F0A;
    --fresh: #FF453A;
    --aging: #FF9F0A;
    --stale: #6E6E76;
    --radius: 16px;
    --topbar: calc(env(safe-area-inset-top) + 50px);
    --glass: rgba(22,23,28,.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", "Sukhumvit Set", sans-serif;
    background: var(--bg); color: var(--text);
    position: relative; max-width: 480px; margin: 0 auto;
    height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1200;
    padding: calc(env(safe-area-inset-top) + 11px) 20px 11px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(11,11,15,.7); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--hair);
  }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { display: none; }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  #langBtn {
    font-family: inherit; font-size: 12px; font-weight: 600; color: var(--text);
    background: rgba(255,255,255,.1); border: 1px solid var(--hair); border-radius: 999px;
    padding: 5px 11px; letter-spacing: .03em;
  }
  #locBadge { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #locBadge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 7px var(--blue); }

  main { position: absolute; inset: 0; overflow: hidden; }
  .tab { position: absolute; inset: 0; display: none; }
  .tab.active { display: block; }
  #tab-feed.active, #tab-route.active { display: flex; flex-direction: column; }

  #map, #routeMap { position: absolute; inset: 0; width: 100%; height: 100%; }
  #pickMap { position: absolute; inset: 0; }
  .leaflet-container { background: #0B0B0F; }
  .leaflet-control-attribution {
    background: rgba(11,11,15,.5) !important; color: #6a6a72 !important;
    font-size: 9px !important; padding: 1px 5px !important;
  }
  .leaflet-control-attribution a { color: #8a8a92 !important; }

  /* map legend */
  .legend {
    position: absolute; left: 14px; top: calc(var(--topbar) + 12px); z-index: 1000;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--hair); border-radius: 14px;
    padding: 10px 12px; font-size: 11.5px; line-height: 1.9; color: var(--text);
  }
  .legend { top: calc(var(--topbar) + 58px); }
  .dia { display: inline-block; width: 9px; height: 9px; margin-right: 7px; background: #FFD60A; transform: rotate(45deg); border-radius: 2px; }
  .catbar {
    position: absolute; top: calc(var(--topbar) + 10px); left: 14px; right: 14px; z-index: 1000; display: flex; gap: 6px;
  }
  .catbar button, .feed-cat button, .seg button {
    flex: 1; font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 6px; border-radius: 999px;
    border: 1px solid var(--hair); background: var(--glass); color: var(--muted);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .catbar button.on, .feed-cat button.on, .seg button.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .feed-cat { display: flex; gap: 6px; margin: 0 0 12px; }
  .seg { display: flex; gap: 6px; margin: 10px 0 4px; }
  .seg button { background: var(--surface-2); }
  /* incident pin: yellow road-warning diamond */
  .hz-wrap { background: none; border: none; }
  .hz {
    width: 20px; height: 20px; margin: 2px; transform: rotate(45deg); border-radius: 4px;
    background: #FFD60A; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
  }
  .hz span { transform: rotate(-45deg); color: #1C1C1E; font-weight: 800; font-size: 12px; line-height: 1; }
  .hz.stale { background: #8E8E93; }
  .hz.big { width: 26px; height: 26px; margin: -1px; border-width: 3px; }
  .cat-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
  .cat-tag.cp { background: rgba(255,69,58,.16); color: #FF6961; }
  .cat-tag.inc { background: rgba(255,214,10,.16); color: #FFD60A; }
  .cpcount.inc-some { background: rgba(255,214,10,.16); color: #FFD60A; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }

  /* feed */
  #feedScroll { flex: 1; overflow-y: auto; padding: calc(var(--topbar) + 10px) 14px 120px; -webkit-overflow-scrolling: touch; }
  .section-label { font-size: 12px; color: var(--muted); margin: 6px 4px 10px; letter-spacing: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--hair);
    border-radius: var(--radius); padding: 15px 16px; margin-bottom: 11px;
  }
  .card.fresh { border-color: rgba(255,69,58,.35); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-title { font-size: 15.5px; font-weight: 600; }
  .badge {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; font-weight: 600;
  }
  .badge.dist { background: rgba(255,69,58,.16); color: #FF6961; }
  .badge.dist.far { background: rgba(255,159,10,.16); color: var(--amber); }
  .card-type { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .card-meta { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .card-meta .ok { color: var(--green); }
  .vote-row { display: flex; gap: 8px; margin-top: 12px; }
  .vote-row button {
    flex: 1; font-size: 12.5px; padding: 9px; border-radius: 11px; font-weight: 600;
    border: 1px solid var(--hair); background: var(--surface-2); color: var(--text); font-family: inherit;
  }
  .vote-row button:active { background: #2A2B33; }
  .collapse-bar {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); padding: 13px 16px;
    font-size: 13px; color: var(--muted); display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 11px; cursor: pointer;
  }

  /* route tab */
  #routePanel {
    position: absolute; top: calc(var(--topbar) + 10px); left: 14px; right: 14px; z-index: 1000;
  }
  #routePanel .row { display: flex; gap: 8px; }
  .search-wrap {
    flex: 1; position: relative; display: flex; align-items: center; min-width: 0;
    border: 1px solid var(--hair); border-radius: 13px;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .s-ico { width: 17px; height: 17px; color: var(--muted); margin-left: 12px; flex-shrink: 0; }
  #destInput {
    flex: 1; min-width: 0; font-size: 16px; padding: 12px 8px; border: none; outline: none;
    font-family: inherit; color: var(--text); background: transparent;
  }
  #clearBtn {
    display: none; border: none; background: rgba(255,255,255,.14); color: var(--text);
    width: 22px; height: 22px; border-radius: 50%; font-size: 11px; margin-right: 10px; flex-shrink: 0;
  }
  #suggest {
    display: none; margin-top: 8px; max-height: 55vh; overflow-y: auto;
    background: rgba(28,29,34,.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--hair); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  #suggest.open { display: block; }
  .sg {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px; cursor: pointer;
    border-bottom: 1px solid var(--hair);
  }
  .sg:last-child { border-bottom: none; }
  .sg:active, .sg.hi { background: rgba(255,255,255,.07); }
  .sg-pin {
    width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.1); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .sg-pin svg { width: 15px; height: 15px; }
  .sg-txt { flex: 1; min-width: 0; }
  .sg-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-addr { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .sg-dist { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .sg-empty { padding: 14px; font-size: 13px; color: var(--muted); text-align: center; }
  .delay { color: var(--amber); font-weight: 600; }
  #destInput::placeholder { color: var(--muted); }
  #routeBtn {
    background: var(--accent); color: #fff; border: none; border-radius: 13px;
    padding: 9px 18px; font-size: 14px; font-family: inherit; font-weight: 600;
  }
  #routeHint {
    font-size: 11.5px; color: var(--muted); margin-top: 8px; text-align: center;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 6px 12px; border-radius: 999px; display: inline-block;
    position: relative; left: 50%; transform: translateX(-50%);
  }
  #routeSummary {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1050;
    max-height: 56%; overflow-y: auto;
    background: var(--glass); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border-top: 1px solid var(--hair); border-radius: 22px 22px 0 0;
    padding: 16px 16px 110px; display: none;
  }
  #routeSummary h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .route-hit { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 13px; gap: 8px; }
  .route-hit:last-child { border-bottom: none; }
  .route-hit .t { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .route-opt {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 13px 15px; margin-bottom: 9px; border: 1px solid var(--hair);
    border-radius: 14px; cursor: pointer; background: var(--surface);
  }
  .route-opt.sel { border-color: var(--accent); background: rgba(255,69,58,.12); }
  .route-opt .ro-main { display: flex; flex-direction: column; gap: 3px; }
  .route-opt .ro-main b { font-size: 15px; font-weight: 600; }
  .route-opt .ro-sub { font-size: 12.5px; color: var(--muted); }
  .ro-badges { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .cpcount { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .cpcount.cp-some { background: rgba(255,69,58,.16); color: #FF6961; }
  .cpcount.cp-none { background: rgba(48,209,88,.16); color: var(--green); }
  .toll { font-weight: 600; }
  .toll.yes { color: #FFD60A; }
  .toll.no { color: var(--text); }
  .ro-listhead { font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .nav-row { display: flex; gap: 8px; margin: 6px 0 2px; }
  .nav-btn {
    flex: 1; display: block; text-align: center; text-decoration: none;
    font-weight: 600; font-size: 14px; padding: 13px; border-radius: 13px;
  }
  .nav-btn.g { background: var(--blue); color: #fff; }
  .nav-btn.a { background: var(--surface-2); color: var(--text); border: 1px solid var(--hair); }

  /* bottom nav — floating pill */
  nav {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 50%; transform: translateX(-50%);
    z-index: 1100; display: flex; gap: 4px; padding: 6px;
    background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--hair); border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  nav button {
    background: none; border: none; padding: 8px 15px; border-radius: 999px;
    font-size: 10.5px; color: var(--muted); font-family: inherit; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav button.active { color: #fff; background: rgba(255,255,255,.1); }
  nav button svg { width: 21px; height: 21px; }

  /* FAB */
  #fab {
    position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 82px); z-index: 1100;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 14px 20px; font-size: 14px; font-weight: 600; font-family: inherit;
    box-shadow: 0 6px 20px rgba(255,69,58,.4); display: flex; align-items: center; gap: 7px;
  }

  /* report sheet */
  #sheet {
    position: absolute; inset: 0; z-index: 1300; background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-end;
  }
  #sheet.open { display: flex; }
  #sheetBody { height: 92%; }
  #sheetBody {
    background: var(--surface); border-radius: 24px 24px 0 0; width: 100%;
    max-height: 92%; display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--hair);
  }
  .grabber { width: 38px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); margin: 10px auto 2px; flex-shrink: 0; }
  #sheetBody h2 { font-size: 18px; font-weight: 600; padding: 8px 18px 4px; }
  #sheetBody .hint { font-size: 12.5px; color: var(--muted); padding: 0 18px 12px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px 8px 0; }
  .sh-head h2 { padding-bottom: 0 !important; }
  .sh-x { width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); color: var(--text); font-size: 14px; }
  .steps { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
  .step { border-top: 1px solid var(--hair); display: flex; flex-direction: column; flex-shrink: 0; }
  .step.open { flex: 1 0 auto; min-height: 0; }
  .step-h {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 18px; background: none; border: none;
    color: var(--text); font-family: inherit; text-align: left; flex-shrink: 0;
  }
  .step-h:disabled { opacity: .4; }
  .step-n {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--hair);
  }
  .step.open .step-n { background: var(--accent); color: #fff; border-color: transparent; }
  .step.done:not(.open) .step-n { background: var(--green); color: #04210E; border-color: transparent; }
  .step-t { font-size: 15px; font-weight: 600; flex-shrink: 0; }
  .step-s { flex: 1; text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.open .step-s { display: none; }
  .step-b { display: none; }
  .step.open .step-b { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .step-b.pad, .step-b .pad { padding: 0 18px 12px; }
  #pickWrap { position: relative; flex: 1; min-height: 200px; }
  #pickHint {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 1000; font-size: 12px; white-space: nowrap;
    background: rgba(0,0,0,.6); color: #fff; padding: 5px 11px; border-radius: 999px; pointer-events: none;
  }
  #camWrap { position: relative; flex: 1; min-height: 240px; background: #000; overflow: hidden; }
  #camVideo, #camShot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camShot { display: none; }
  #camWrap.shot #camShot { display: block; }
  #camWrap.shot #camVideo, #camWrap.shot #shutter { display: none; }
  #camMsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }
  #camWrap.err #camMsg { display: flex; }
  #camCheck {
    display: none; position: absolute; left: 12px; right: 110px; bottom: 12px; font-size: 12.5px; font-weight: 600;
    color: #fff; background: rgba(0,0,0,.65); padding: 8px 12px; border-radius: 12px; line-height: 1.35;
  }
  #camCheck.show { display: block; }
  #camCheck.bad { background: rgba(255,69,58,.88); }
  #camCheck.good { background: rgba(48,209,88,.85); }
  #shutter {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,.35);
    background-clip: padding-box; box-shadow: 0 2px 12px rgba(0,0,0,.5);
  }
  #shutter:active { transform: translateX(-50%) scale(.92); }
  #retake {
    display: none; position: absolute; right: 12px; bottom: 12px; font-family: inherit; font-size: 13px; font-weight: 600;
    background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 14px;
  }
  #camWrap.shot #retake { display: block; }
  .cam-note {
    position: absolute; left: 12px; top: 10px; font-size: 11.5px; color: #fff; background: rgba(0,0,0,.55);
    padding: 5px 10px; border-radius: 999px;
  }
  .sheet-actions .submit:disabled { opacity: .45; }
  body.routing nav { display: none; }
  body.routing #routeSummary { padding-bottom: calc(env(safe-area-inset-bottom) + 22px); }
  .rs-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .rs-head h3 { margin: 0 !important; }
  #routeClose {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: none; font-size: 15px;
    background: rgba(255,255,255,.12); color: var(--text); font-family: inherit;
  }
  .toll-filter { display: flex; gap: 6px; margin: 0 0 12px; }
  .toll-filter button {
    flex: 1; font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 6px; border-radius: 999px;
    border: 1px solid var(--hair); background: var(--surface-2); color: var(--muted);
  }
  .toll-filter button.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .nav-note { font-size: 11.5px; color: var(--muted); margin: -2px 0 8px; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%);
    z-index: 1000; pointer-events: none; font-size: 30px; line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.6));
  }
  .sheet-actions { padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px); border-top: 1px solid var(--hair); flex-shrink: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .chip {
    font-size: 12.5px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--hair); background: var(--surface-2); font-family: inherit; color: var(--text);
  }
  .chip.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sheet-form label { font-size: 13px; font-weight: 600; color: var(--muted); }
  #labelInput {
    width: 100%; font-size: 15px; padding: 12px 14px; border: 1px solid var(--hair);
    border-radius: 12px; font-family: inherit; margin: 12px 0 0; background: var(--surface-2); color: var(--text);
  }
  #labelInput::placeholder { color: var(--muted); }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .cancel { flex: 1; background: var(--surface-2); border: 1px solid var(--hair); color: var(--text); border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit; }
  .sheet-actions .submit { flex: 2; background: var(--accent); color: #fff; border: none; border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit; }

  #toast {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px;
    background: rgba(40,40,46,.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #fff; font-size: 13px; padding: 12px 20px; border: 1px solid var(--hair);
    border-radius: 999px; z-index: 1400; display: none; white-space: nowrap; max-width: 90%;
  }
  /* dark leaflet popups */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface-2); color: var(--text); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .leaflet-popup-content-wrapper { border-radius: 14px; border: 1px solid var(--hair); }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .pin-pop { font-size: 13px; line-height: 1.55; min-width: 195px; }
  .pin-pop b { font-size: 14.5px; font-weight: 600; }
  .pin-pop .meta { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
  .pin-pop .vr { display: flex; gap: 7px; }
  .links { margin-top: 7px !important; }
  .links a, .links button {
    flex: 1; display: block; text-align: center; text-decoration: none; font-size: 12px; font-weight: 600;
    padding: 8px 4px; border-radius: 9px; border: 1px solid var(--hair); font-family: inherit;
    background: transparent !important; color: #64B3FF !important; white-space: nowrap;
  }
  .pin-pop .vr button { flex: 1; font-size: 12px; padding: 8px; border-radius: 9px; border: 1px solid var(--hair); background: var(--surface); color: var(--text); font-family: inherit; font-weight: 600; }

  /* motion */
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pinPop {
    0% { opacity: 0; transform: translateY(-13px) scale(.3); }
    60% { transform: translateY(0) scale(1.15); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  #sheet.open { animation: fadeIn .18s ease; }
  #sheet.open #sheetBody { animation: sheetUp .34s cubic-bezier(.32,.72,0,1); }
  #routeSummary.show { animation: sheetUp .34s cubic-bezier(.32,.72,0,1); }
  .pin { transform-box: fill-box; transform-origin: center; animation: pinPop .5s cubic-bezier(.34,1.56,.64,1) both; }
  @media (prefers-reduced-motion: reduce) {
    #sheet.open, #sheet.open #sheetBody, #routeSummary.show, .pin { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>ด่าน</h1>
    <div class="sub">แจ้งเตือนช่วยกันจ้าาา</div>
  </div>
  <div class="hdr-right">
    <div id="locBadge"></div>
    <button id="langBtn" onclick="toggleLang()" aria-label="Switch language">EN</button>
  </div>
</header>

<main>
  <div class="tab active" id="tab-map">

    <div class="catbar" id="catbar"></div>

  </div>

  <div class="tab" id="tab-feed">
    <div id="feedScroll"></div>
  </div>

  <div class="tab" id="tab-route">
    <div id="routePanel">
      <div class="row">
        <div class="search-wrap">

          <input id="destInput" data-i18n-ph="destPh" autocomplete="off" enterkeyhint="search">
          <button id="clearBtn" aria-label="Clear" onclick="clearSearch()">✕</button>
        </div>
        <button id="routeBtn" data-i18n="routeBtn"></button>
      </div>
      <div id="suggest"></div>
      <div id="routeHint" data-i18n="routeHint"></div>
    </div>
    <div id="routeMap"></div>
    <div id="routeSummary"></div>
  </div>

  <button id="fab" onclick="openSheet()">＋ <span data-i18n="fab"></span></button>

  <nav>
    <button data-tab="map" class="active" onclick="switchTab('map')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6l6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      <span data-i18n="tabMap"></span>
    </button>
    <button data-tab="feed" onclick="switchTab('feed')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span data-i18n="tabFeed"></span>
    </button>
    <button data-tab="route" onclick="switchTab('route')">

      <span data-i18n="tabRoute"></span>
    </button>
  </nav>

  <div id="sheet">
    <div id="sheetBody">
      <div class="grabber"></div>
      <div class="sh-head"><h2 data-i18n="sheetTitle"></h2><button class="sh-x" onclick="closeSheet()" aria-label="Close">✕</button></div>
      <!-- Stepper (type → location → photo): one step open at a time; finished steps collapse to a ✓ summary and can be reopened. -->
      <div class="steps">
        <section class="step" data-step="type">
          <button class="step-h" onclick="goStep(0)"><span class="step-n">1</span><span class="step-t" data-i18n="st2"></span><span class="step-s" id="sum2"></span></button>
          <div class="step-b pad">
            <div class="seg" id="catSeg"></div>
            <div class="chips" id="typeChips"></div>
          </div>
        </section>
        <section class="step" data-step="where">
          <button class="step-h" onclick="goStep(1)"><span class="step-n">2</span><span class="step-t" data-i18n="st3"></span><span class="step-s" id="sum3"></span></button>

        </section>
      </div>
      <div class="sheet-actions">

}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  document.documentElement.lang = lang;

  if (routeData.length) { drawRoutes(); renderRouteSummary(); }
}

let userLoc = null, locReal = false;
let checkpoints = [];
let selType = TYPE_KEYS[0];

let mapLayer = L.layerGroup(), routeCpLayer = L.layerGroup(), routeLines = L.layerGroup(), destMarker = null, userMarkers = [];
let destLatLng = null;

function routeMatches(r) { return tollFilter === "all" || (tollFilter === "toll" ? r.toll === true : r.toll === false); }
function setTollFilter(k) { tollFilter = k; renderRouteSummary(); drawRoutes(); }

/* ---------- basemap ----------
   OpenFreeMap vector tiles (free, no API key) rendered by MapLibre inside Leaflet.
   Its "dark" style is recoloured below into a cleaner, Apple-Maps-like dark palette. */
const STYLE_URL = "https://tiles.openfreemap.org/styles/dark";
const MAP_ATTR = '<a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const PALETTE = {
  background: "#1C1D21", landuse_residential: "#1F2024", landcover_wood: "#1D2A22", landuse_park: "#1D2A22",
  water: "#14222F", waterway: "#14222F", building: "#25262B",
  highway_path: "#2C2D33", highway_minor: "#3A3B42", highway_major_casing: "#2A2B30", highway_major_inner: "#4E5059",
  highway_major_subtle: "#4E5059", highway_motorway_casing: "#2A2B30", highway_motorway_inner: "#6B6E78",
  highway_motorway_subtle: "#6B6E78", railway_transit: "#33343A", railway_minor: "#33343A", railway: "#33343A",
};
const baseMaps = [];

function tuneStyle(gl) {
  for (const [id, color] of Object.entries(PALETTE)) {
    const l = gl.getLayer(id); if (!l) continue;
    const prop = l.type === "background" ? "background-color" : l.type === "fill" ? "fill-color" : "line-color";
    gl.setPaintProperty(id, prop, color);
    if (l.type === "fill") gl.setPaintProperty(id, "fill-opacity", 1);
  }
  ["highway_minor", "highway_major_inner", "highway_motorway_inner"].forEach(id => gl.getLayer(id) && gl.setPaintProperty(id, "line-opacity", 1));
  gl.getStyle().layers.filter(l => l.type === "symbol").forEach(l => {
    if (!gl.getLayoutProperty(l.id, "text-field")) return;
    const major = l.id.startsWith("place_city") || l.id === "place_town";
    gl.setPaintProperty(l.id, "text-color", major ? "#E4E4E8" : l.id.startsWith("highway") ? "#9C9EA6" : "#B4B6BE");
    gl.setPaintProperty(l.id, "text-halo-color", "rgba(20,20,24,.9)");
    gl.setPaintProperty(l.id, "text-halo-width", 1.2);
  });
}
function setMapLabels(gl) {
  if (!gl || !gl.isStyleLoaded()) return;
  const field = lang === "en"
    ? ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"]]
    : ["coalesce", ["get", "name:th"], ["get", "name"]];
  gl.getStyle().layers.filter(l => l.type === "symbol").forEach(l => {
    if (gl.getLayoutProperty(l.id, "text-field")) gl.setLayoutProperty(l.id, "text-field", field);
  });
}
function addBasemap(lmap) {
  const layer = L.maplibreGL({ style: STYLE_URL, attribution: MAP_ATTR }).addTo(lmap);
  const gl = layer.getMaplibreMap();
  baseMaps.push(gl);
  gl.on("styleimagemissing", e => { // quiet missing pattern sprites
    if (!gl.hasImage(e.id)) gl.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
  });
  gl.on("load", () => { tuneStyle(gl); setMapLabels(gl); });
  return layer;
}

function locate() {

  navigator.geolocation.getCurrentPosition(
    p => { userLoc = [p.coords.latitude, p.coords.longitude]; onLocated(true); },

function haversineM(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dp = (b[0]-a[0])*toR, dl = (b[1]-a[1])*toR;
  const h = Math.sin(dp/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function agoText(min) {
  if (min < 1) return t("justNow");
  if (min < 60) return t("minAgo", min);
  const h = Math.floor(min/60), m = min%60;
  return m ? t("hMinAgo", h, m) : t("hAgo", h);
}
function distText(m) { return m < 1000 ? `${Math.round(m)} ${t("m")}` : `${(m/1000).toFixed(1)} ${t("km")}`; }

// Checkpoints: recency-coloured circles. Incidents: yellow warning diamonds (grey when stale).
function makeMarker(cp, big = false) {
  if (catOf(cp) === "incident") {
    const sz = big ? 30 : 24;
    return L.marker([cp.lat, cp.lng], { icon: L.divIcon({
      className: "hz-wrap", iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
      html: `<div class="hz ${cp.age_minutes > 180 ? "stale" : ""} ${big ? "big" : ""}"><span>!</span></div>`,
    }) });
  }
  const st = styleFor(cp);
  return L.circleMarker([cp.lat, cp.lng], big ? { ...st, radius: 13, weight: 3 } : st);
}
function styleFor(cp) {
  if (cp.age_minutes <= 60) return { color: "#fff", fillColor: "#FF453A", fillOpacity: 1, radius: 11, weight: 2 };
  if (cp.age_minutes <= 180) return { color: "#fff", fillColor: "#FF9F0A", fillOpacity: .9, radius: 9, weight: 2 };
  return { color: "#fff", fillColor: "#8E8E93", fillOpacity: .7, radius: 7, weight: 2 };
}

/* ---------- route tab ---------- */
function ptSegDistM(p, a, b) {
  const toR = Math.PI/180, latR = p[0]*toR;
  const mPerLat = 111320, mPerLng = 111320*Math.cos(latR);
  const px = (p[1]-a[1])*mPerLng, py = (p[0]-a[0])*mPerLat;
  const bx = (b[1]-a[1])*mPerLng, by = (b[0]-a[0])*mPerLat;
  const len2 = bx*bx + by*by;
  let tt = len2 ? (px*bx + py*by)/len2 : 0;
  tt = Math.max(0, Math.min(1, tt));
  const dx = px - tt*bx, dy = py - tt*by;
  return { d: Math.sqrt(dx*dx + dy*dy), t: tt };
}

function distToRoute(cp, coords) {
  let best = Infinity, along = 0, acc = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const segLen = haversineM(coords[i], coords[i+1]);
    const r = ptSegDistM([cp.lat, cp.lng], coords[i], coords[i+1]);
    if (r.d < best) { best = r.d; along = acc + r.t*segLen; }
    acc += segLen;
  }
  return { dist: best, along };
}

/* ---------- place search (Google-Maps-style autocomplete via /api/search) ---------- */
let suggestions = [], suggestTimer = null, suggestSeq = 0;
const PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';

async function searchPlaces(q, final = false) {
  const c = userLoc || DEFAULT_LOC;
  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&lat=${c[0]}&lng=${c[1]}&lang=${lang}${final ? "&final=1" : ""}`);
  return res.ok ? (await res.json()).results || [] : [];
}
function renderSuggest(q, submitted = false) {
  const el = $("suggest");
  if (!q || q.length < 2) { el.classList.remove("open"); $("routeHint").style.display = ""; return; }
  el.innerHTML = suggestions.length
    ? suggestions.map((r, i) => `<div class="sg" onmousedown="event.preventDefault()" onclick="pickPlace(${i})">
        <div class="sg-pin">${PIN_SVG}</div>
        <div class="sg-txt"><div class="sg-name">${esc(r.name)}</div>${r.address ? `<div class="sg-addr">${esc(r.address)}</div>` : ""}</div>
        ${r.dist_m != null ? `<div class="sg-dist">${distText(r.dist_m)}</div>` : ""}
      </div>`).join("")
    : (submitted ? `<div class="sg-empty">${t("noResults")}</div>`
      : `<div class="sg" onmousedown="event.preventDefault()" onclick="submitSearch()">
          <div class="sg-pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
          <div class="sg-txt"><div class="sg-name">${t("searchFor", esc(q))}</div></div></div>`);
  el.classList.add("open");
  $("routeHint").style.display = "none";
}
function onSearchInput() {
  const q = $("destInput").value.trim();
  $("clearBtn").style.display = q ? "block" : "none";
  clearTimeout(suggestTimer);
  if (q.length < 2) { suggestions = []; renderSuggest(""); return; }
  suggestTimer = setTimeout(async () => {
    const seq = ++suggestSeq;
    const res = await searchPlaces(q).catch(() => []);
    if (seq !== suggestSeq) return; // a newer keystroke won
    suggestions = res;
    renderSuggest(q);
  }, 280);
}
function closeSuggest() { $("suggest").classList.remove("open"); $("routeHint").style.display = ""; }
function pickPlace(i) {
  const r = suggestions[i]; if (!r) return;
  $("destInput").value = r.name;
  $("destInput").blur();
  closeSuggest();
  destLatLng = L.latLng(r.lat, r.lng);
  if (destMarker) destMarker.remove();
  destMarker = L.marker(destLatLng).addTo(routeMap);
  buildRoute();
}
async function submitSearch() {
  const q = $("destInput").value.trim();
  if (!q) return toast(t("needDest"));
  clearTimeout(suggestTimer);
  if (!suggestions.length) {
    const seq = ++suggestSeq;
    suggestions = await searchPlaces(q, true).catch(() => []);
    if (seq !== suggestSeq) return;
  }
  if (!suggestions.length) { renderSuggest(q, true); return; }
  pickPlace(0);
}
function clearSearch() {
  $("destInput").value = ""; suggestions = []; closeSuggest();
  $("clearBtn").style.display = "none"; $("destInput").focus();
}

// Route options come from our backend (/api/routes), which asks the routing engine for its
// normal options with tolls allowed AND with tolls avoided, then orders them by travel time.
// Each: {coords:[[lat,lng]...], km, mins, toll: true|false|null}. Checkpoints never affect
// which routes are returned or their order — we only count what lies on each one.
async function fetchRoutes(o, dest) {
  const q = `olat=${o[0]}&olng=${o[1]}&dlat=${dest.lat}&dlng=${dest.lng}`;
  const res = await fetch(`/api/routes?${q}`);
  if (!res.ok) throw new Error("routing");
  return await res.json();
}

async function buildRoute() {
  if (!destLatLng) return submitSearch();
  const o = userLoc || DEFAULT_LOC;
  toast(t("calcRoute"));
  let raw;
  try { const js = await fetchRoutes(o, destLatLng); raw = js.routes || []; routeTraffic = !!js.traffic; }
  catch { return toast(t("routeErr")); }
  if (!raw.length) return toast(t("noRoute"));

  // Routes come from the engine in its own order (by travel time). We annotate each
  // with the checkpoints that fall on it — we never reorder by checkpoint count or
  // feed checkpoints into the routing itself.
  const active = checkpoints.filter(c => c.status === "active");
  routeData = raw.map(rt => {
    const hits = [];
    active.forEach(cp => {
      const r = distToRoute(cp, rt.coords);
      if (r.dist <= ROUTE_BUFFER_M) hits.push({ cp, along: r.along });
    });
    hits.sort((a, b) => a.along - b.along);
    return { coords: rt.coords, hits, km: rt.km, mins: rt.mins, toll: rt.toll, delay: rt.delay_mins || 0 };
  });
  selRoute = 0;
  lastDest = { lat: destLatLng.lat, lng: destLatLng.lng };
  destLatLng = null;
  drawRoutes();
  renderRouteSummary();
  document.body.classList.add("routing");
  const sum = $("routeSummary");
  sum.classList.remove("show"); void sum.offsetWidth; sum.classList.add("show");
  setTimeout(() => {
    routeMap.invalidateSize();
    const b = L.latLngBounds(routeData.flatMap(r => r.coords));
    const sheetH = $("routeSummary").offsetHeight || 0;
    routeMap.fitBounds(b, { paddingTopLeft: [30, 150], paddingBottomRight: [30, sheetH + 20] });
  }, 250);
}

function closeRoute() {
  routeData = []; selRoute = 0; lastDest = null; destLatLng = null;
  routeLines.clearLayers();
  if (destMarker) { destMarker.remove(); destMarker = null; }
  const sum = $("routeSummary"); sum.style.display = "none"; sum.classList.remove("show");
  document.body.classList.remove("routing");
  $("destInput").value = ""; $("clearBtn").style.display = "none"; suggestions = []; closeSuggest();
  renderRouteCps();
  if (userLoc) routeMap.setView(userLoc, 12);
}

function drawRoutes() {
  routeLines.clearLayers();
  // Draw unselected first so the selected route sits on top.
  routeData.forEach((r, i) => {
    if (i === selRoute || !routeMatches(r)) return;
    L.polyline(r.coords, { color: "#5A5A62", weight: 4, opacity: .6 })
      .on("click", () => { selRoute = i; drawRoutes(); renderRouteSummary(); })
      .addTo(routeLines);
  });
  const sel = routeData[selRoute];
  L.polyline(sel.coords, { color: "#0A84FF", weight: 6, opacity: .95 }).addTo(routeLines);

  renderRouteCps();
}

// Every report is shown on the route map (per the category filter); ones on the selected route are drawn larger.
function renderRouteCps() {
  routeCpLayer.clearLayers();
  const onSel = new Set(routeData.length ? routeData[selRoute].hits.map(h => h.cp.id) : []);
  checkpoints.filter(cp => catShown(cp) || onSel.has(cp.id)).forEach(cp => {
    makeMarker(cp, onSel.has(cp.id)).bindPopup(popupHtml(cp), POPUP_OPTS).addTo(routeCpLayer);
  });
}

function renderRouteSummary() {
  const sum = $("routeSummary");
  sum.style.display = "block";
  // Toll filter only narrows the list; routes always stay in travel-time order.
  const visible = routeData.map((r, i) => i).filter(i => routeMatches(routeData[i]));
  if (visible.length && !visible.includes(selRoute)) { selRoute = visible[0]; drawRoutes(); }
  const hasTollInfo = routeData.some(r => r.toll != null);
  const filterBar = hasTollInfo ? `<div class="toll-filter">${["all", "toll", "noToll"].map(k =>
      `<button class="${tollFilter === k ? "on" : ""}" onclick="setTollFilter('${k}')">${t("f_" + k)}</button>`).join("")}</div>` : "";
  const opts = visible.length ? visible.map(i => {
    const r = routeData[i];
    const n = r.hits.filter(h => catOf(h.cp) === "checkpoint").length;
    const ni = r.hits.length - n;
    return `<div class="route-opt ${i === selRoute ? "sel" : ""}" onclick="selRoute=${i};drawRoutes();renderRouteSummary()">
        <div class="ro-main">
          <b>${t("routeN", i + 1)}</b>
          <span class="ro-sub">${t("minKm", r.mins, r.km.toFixed(1))}${r.delay > 0 ? ` · <span class="delay">${t("delay", r.delay)}</span>` : ""}${r.toll == null ? "" : ` · <span class="toll ${r.toll ? "yes" : "no"}">${t(r.toll ? "toll" : "noToll")}</span>`}</span>
        </div>
        <div class="ro-badges"><span class="cpcount ${n ? "cp-some" : "cp-none"}">${n ? t("cpN", n) : t("cpNone")}</span>${ni ? `<span class="cpcount inc-some">${t("incN", ni)}</span>` : ""}</div>
      </div>`;
  }).join("") : `<div class="route-hit" style="color:var(--muted)">${t("noRouteFilter")}</div>`;

  const sel = routeData[selRoute];
  const list = sel.hits.length
    ? sel.hits.map(h => `<div class="route-hit">
          <div><b>${esc(labelName(h.cp.label))}</b><div class="t">${catTag(h.cp)}${esc(typeName(h.cp.type))} · ${t("lastConfirmed", agoText(h.cp.age_minutes))}</div></div>
          <span class="badge dist">${t("kmAt", (h.along / 1000).toFixed(1))}</span>
        </div>`).join("")
    : `<div class="route-hit" style="color:var(--muted)">${t("noCpOnRoute")}</div>`;

  // Hand off to Google/Apple Maps for turn-by-turn; the nav app starts from live GPS.
  // Google: the CHECKPOINTS on the selected route (never incidents) are added as stops, in
  // driving order, so navigation passes through them. Max 3 — the mobile-app limit for URL
  // stops. A route with no checkpoints sends the destination only and Google picks its own way.
  // Apple Maps URLs don't support stops, so Apple always gets the destination only.
  const cpStops = sel.hits.filter(h => catOf(h.cp) === "checkpoint").slice(0, MAX_NAV_STOPS);
  const gWaypoints = cpStops.length
    ? "&waypoints=" + cpStops.map(h => `${h.cp.lat.toFixed(6)},${h.cp.lng.toFixed(6)}`).join("%7C") : "";
  const navBtns = lastDest ? `<div class="ro-listhead">${t("navWith")}</div>
    <div class="nav-note">${cpStops.length ? t("navNoteStops", cpStops.length) : t("navNote")}</div>
    <div class="nav-row">
      <a class="nav-btn g" href="https://www.google.com/maps/dir/?api=1&destination=${lastDest.lat},${lastDest.lng}${gWaypoints}&travelmode=driving" target="_blank" rel="noopener">Google Maps ↗</a>
      <a class="nav-btn a" href="https://maps.apple.com/?daddr=${lastDest.lat},${lastDest.lng}&dirflg=d" target="_blank" rel="noopener">Apple Maps ↗</a>
    </div>` : "";

  sum.innerHTML = `<div class="rs-head"><h3>${t("chooseRoute")} <span style="font-weight:400;color:var(--muted);font-size:11.5px">· ${t("byTime")} · ${t(routeTraffic ? "liveTraffic" : "noTraffic")}</span></h3>
      <button id="routeClose" onclick="closeRoute()" aria-label="${t("closeRoute")}">✕</button></div>
    ${filterBar}
    ${opts}
    <div class="ro-listhead">${t("onRoute", selRoute + 1)}</div>
    ${list}
    ${navBtns}`;
}

/* ---------- report sheet ----------
   Anti-spam: live camera only (no file upload), reporter's live GPS must be near the pin,
   server rate-limits and (if configured) has Claude check the photo shows a checkpoint.
   The photo is only used for that check and is never stored. */
let camStream = null, photoData = null, reportPos = null, photoOk = false, photoProbs = undefined;

/* On-device photo check: MobileCLIP-S0 (Apple, open weights) via transformers.js, zero server cost.
   The model compares the photo with short text descriptions grouped by report kind; the text side was computed offline and
   ships as /static/clip_labels.json, so only the ~23 MB image model downloads (once, then cached).
   Pass rule: the photo must look like a road event at all (1 - P(neg) >= 0.5) AND the selected
   type must be plausible (P(type group) >= 0.15). On 47 sample photos: 34/36 real reports passed,
   all food/room/selfie photos were rejected. */
const CLIP_MODEL = "Xenova/mobileclip_s0";
const CLIP_EVENT_MIN = 0.5, CLIP_TYPE_MIN = 0.15, CLIP_AUTODETECT = 0.6;
let clipReady = null;
function loadClip() {
  if (!clipReady) clipReady = (async () => {
    const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2");
    T.env.allowLocalModels = false;
    const [processor, model, labels] = await Promise.all([
      T.AutoProcessor.from_pretrained(CLIP_MODEL),
      T.CLIPVisionModelWithProjection.from_pretrained(CLIP_MODEL, { dtype: "fp16", device: "wasm" }),
      fetch("/static/clip_labels.json").then(r => r.json()),
    ]);
    return { T, processor, model, labels };
  })().catch(e => { clipReady = null; throw e; });
  return clipReady;
}
// Returns {group: probability} over the label groups (checkpoint, accident, roadwork, flood,
// blocked, neg), or null if the model can't run.
async function photoScores(canvas) {
  try {
    const { T, processor, model, labels } = await loadClip();
    const img = await T.RawImage.fromCanvas(canvas);
    const { image_embeds } = await model(await processor(img));
    const v = image_embeds.normalize().tolist()[0];
    const logits = labels.embeds.map(e => 100 * e.reduce((s, x, i) => s + x * v[i], 0));
    const m = Math.max(...logits), ex = logits.map(l => Math.exp(l - m)), z = ex.reduce((a, b) => a + b);
    const out = {};
    labels.groups.forEach((g, i) => { out[g] = (out[g] || 0) + ex[i] / z; });
    return out;
  } catch (e) {
    console.warn("photo check unavailable", e);
    return null;
  }
}

function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(tr => tr.stop()); camStream = null; }
}
async function startCamera() {
  const wrap = $("camWrap");
  photoData = null; photoOk = false; photoProbs = undefined; wrap.classList.remove("shot", "err"); $("camCheck").className = ""; updateSubmit();
  stopCamera();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false,
    });
    $("camVideo").srcObject = camStream;
  } catch (e) {
    $("camMsg").textContent = t("camErr");
    wrap.classList.add("err");
  }
}
async function capturePhoto() {
  const v = $("camVideo");
  if (!camStream || !v.videoWidth) return;
  const scale = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  photoData = c.toDataURL("image/jpeg", 0.75);
  $("camShot").src = photoData;
  $("camWrap").classList.add("shot");
  stopCamera();
  const chk = $("camCheck");
  chk.textContent = t("checking"); chk.className = "show";
  updateSubmit();
  const shot = photoData;
  const probs = await photoScores(c);
  if (shot !== photoData) return; // retaken meanwhile
  photoProbs = probs;
  // Auto-pick the type when the photo clearly shows one kind of report.
  let detected = null;
  if (probs) {
    const best = Object.entries(probs).filter(([g]) => g !== "neg").sort((a, b) => b[1] - a[1])[0];
    if (best && best[1] >= CLIP_AUTODETECT && TYPES[selType].g !== best[0]) {
      selType = TYPE_KEYS.find(k => TYPES[k].g === best[0]);
      reportCat = TYPES[selType].cat;
      renderChips();
      detected = typeName(selType);
    }
  }
  evalPhoto(detected);
}
// Re-checks the stored photo scores against the currently selected type.
function evalPhoto(detected) {
  const chk = $("camCheck");
  if (!photoData || photoProbs === undefined) return;
  // Fail open if the model couldn't load (old phone / offline) — GPS + rate limits still apply.
  if (photoProbs === null) { photoOk = true; chk.className = ""; updateSubmit(); return; }
  photoOk = (1 - (photoProbs.neg || 0)) >= CLIP_EVENT_MIN && (photoProbs[TYPES[selType].g] || 0) >= CLIP_TYPE_MIN;
  chk.textContent = photoOk ? (detected ? t("detected", detected) : t("photoOk")) : t("photoBad");
  chk.className = "show " + (photoOk ? "good" : "bad");
  updateSubmit();
}
/* Report stepper: 1 type → 2 location → 3 photo → send. */
const STEPS = ["type", "where", "photo"];
let step = 0, maxStep = 0;
function updateSubmit() { renderSteps(); }
function renderSteps() {
  const last = STEPS.length - 1;
  document.querySelectorAll(".step").forEach(el => {
    const i = STEPS.indexOf(el.dataset.step);
    el.classList.toggle("open", i === step);
    el.classList.toggle("done", i < maxStep || (el.dataset.step === "photo" && photoOk));
    el.querySelector(".step-h").disabled = i > maxStep;
  });
  $("sum1").textContent = photoData && photoOk ? "✓ " + t("photoDone") : "";
  $("sum2").textContent = (maxStep > STEPS.indexOf("type") ? "✓ " : "") + typeName(selType);
  $("sum3").textContent = reportPos && pickMap ? t("fromYou", distText(haversineM(reportPos, [pickMap.getCenter().lat, pickMap.getCenter().lng]))) : "";
  $("backBtn").textContent = step === 0 ? t("cancel") : t("back");
  $("nextBtn").textContent = step === last ? "＋ " + t("submit") : t("next");
  $("nextBtn").disabled = STEPS[step] === "photo" ? !(photoData && photoOk) : false;
}
function goStep(i) {
  if (i > maxStep) return;
  step = i;
  renderSteps();
  const name = STEPS[i];
  if (name === "photo" && !photoData && !camStream) startCamera();
  if (name !== "photo" && camStream && !photoData) stopCamera(); // camera only runs on the photo step
  if (name === "where" && pickMap) setTimeout(() => { pickMap.invalidateSize(); renderSteps(); }, 60);
}
function stepNext() {
  if (STEPS[step] === "photo") {
    if (!(photoData && photoOk)) return toast(t(photoData ? "photoBad" : "needPhoto"));
    return submitReport();
  }
  maxStep = Math.max(maxStep, step + 1);
  goStep(step + 1);
}
function stepBack() { step === 0 ? closeSheet() : goStep(step - 1); }

function openSheet() {
  $("sheet").classList.add("open");
  step = 0; maxStep = 0;
  if (!pickMap) {
    pickMap = L.map("pickMap", { zoomControl: false }).setView(userLoc || DEFAULT_LOC, 16);
    addBasemap(pickMap);
    pickMap.on("moveend", renderSteps);
  } else {
    pickMap.setView(userLoc || DEFAULT_LOC, 16);
  }
  setTimeout(() => pickMap.invalidateSize(), 150);
  photoData = null; photoOk = false; photoProbs = undefined; $("camWrap").classList.remove("shot", "err"); $("camCheck").className = "";
  renderChips();
  renderSteps();
  loadClip().catch(() => {}); // warm up the model while the user aims
  // Fresh high-accuracy fix: the pin starts here and the server checks the pin is near it.
  reportPos = null;
  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => { reportPos = [p.coords.latitude, p.coords.longitude]; pickMap.setView(reportPos, 17); renderSteps(); },
    () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}
function closeSheet() {
  $("sheet").classList.remove("open");
  stopCamera(); photoData = null; photoOk = false; photoProbs = undefined; $("camWrap").classList.remove("shot", "err"); $("camCheck").className = "";
}

async function submitReport() {
  if (!photoData) return toast(t("needPhoto"));
  if (!photoOk) return toast(t("photoBad"));
  if (!reportPos) return toast(t("needGps"));
  const c = pickMap.getCenter();
  $("nextBtn").disabled = true;
  toast(t("verifying"));
  let res, js = {};
  try {
    res = await fetch("/api/checkpoints", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        lat: c.lat, lng: c.lng, type: selType, label: $("labelInput").value,
        user_lat: reportPos[0], user_lng: reportPos[1],
      })
    });
    js = await res.json();
  } catch (e) { updateSubmit(); return toast(t("sendErr")); }
  if (!res.ok || !js.ok) {
    updateSubmit();
    const msg = { need_gps: "needGps", too_far: "tooFar", rate_limited: "rateLimited" }[js.error];
    return toast(t(msg || "sendErr"));
  }
  closeSheet();
  $("labelInput").value = "";
  toast(js.merged ? t("merged") : t("sent"));
  loadCheckpoints();
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(el._h);
  el._h = setTimeout(() => el.style.display = "none", 2600);
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.id === "tab-" + name));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  $("fab").style.display = name === "route" ? "none" : "flex";
  setTimeout(() => {
    if (name === "map") map.invalidateSize();
    if (name === "route") routeMap.invalidateSize();
  }, 60);
}

function renderChips() {
  $("catSeg").innerHTML = ["checkpoint", "incident"].map(c =>
    `<button class="${reportCat === c ? "on" : ""}" onclick="setReportCat('${c}')">${t("c_" + c)}</button>`).join("");
  $("typeChips").innerHTML = TYPE_KEYS.map((k, i) => TYPES[k].cat !== reportCat ? "" :
    `<button class="chip ${k === selType ? "sel" : ""}" onclick="pickType(${i})">${esc(typeName(k))}</button>`).join("");
}
function setReportCat(c) {
  reportCat = c;
  if (TYPES[selType].cat !== c) selType = TYPE_KEYS.find(k => TYPES[k].cat === c);
  renderChips(); evalPhoto();
}
function pickType(i) { selType = TYPE_KEYS[i]; renderChips(); evalPhoto(); }
$("routeBtn").onclick = () => { destLatLng = null; submitSearch(); };
$("destInput").addEventListener("input", () => { destLatLng = null; onSearchInput(); });
$("destInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); destLatLng = null; submitSearch(); } });
$("destInput").addEventListener("focus", () => { if ($("destInput").value.trim().length >= 2 && suggestions.length) renderSuggest($("destInput").value.trim()); });
$("destInput").addEventListener("blur", () => setTimeout(closeSuggest, 150));

initMaps();
applyLang();
locate();
loadCheckpoints();
setInterval(loadCheckpoints, 60000);
</script>
</body>
