<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ด่าน — แจ้งเตือนด่านตรวจ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0B0B0F;
    --surface: #16171C;
    --surface-2: #1F2027;
    --text: #F5F5F7;
    --muted: #93939C;
    --hair: rgba(255,255,255,.09);
    --accent: #FF453A;
    --blue: #0A84FF;
    --green: #30D158;
    --amber: #FF9F0A;
    --fresh: #FF453A;
    --aging: #FF9F0A;
    --stale: #6E6E76;
    --radius: 16px;
    --topbar: calc(env(safe-area-inset-top) + 50px);
    --glass: rgba(22,23,28,.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Thai", "Sukhumvit Set", sans-serif;
    background: var(--bg); color: var(--text);
    position: relative; max-width: 480px; margin: 0 auto;
    height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1200;
    padding: calc(env(safe-area-inset-top) + 11px) 20px 11px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(11,11,15,.7); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--hair);
  }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  header .sub { display: none; }
  #locBadge { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #locBadge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 7px var(--blue); }

  main { position: absolute; inset: 0; overflow: hidden; }
  .tab { position: absolute; inset: 0; display: none; }
  .tab.active { display: block; }
  #tab-feed.active, #tab-route.active { display: flex; flex-direction: column; }

  #map, #routeMap { position: absolute; inset: 0; width: 100%; height: 100%; }
  #pickMap { position: absolute; inset: 0; }
  .leaflet-container { background: #0B0B0F; }
  .leaflet-control-attribution {
    background: rgba(11,11,15,.5) !important; color: #6a6a72 !important;
    font-size: 9px !important; padding: 1px 5px !important;
  }
  .leaflet-control-attribution a { color: #8a8a92 !important; }

  /* map legend */
  .legend {
    position: absolute; left: 14px; bottom: 108px; z-index: 1000;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--hair); border-radius: 14px;
    padding: 10px 12px; font-size: 11.5px; line-height: 1.9; color: var(--text);
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }

  /* feed */
  #feedScroll { flex: 1; overflow-y: auto; padding: calc(var(--topbar) + 10px) 14px 120px; -webkit-overflow-scrolling: touch; }
  .section-label { font-size: 12px; color: var(--muted); margin: 6px 4px 10px; letter-spacing: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--hair);
    border-radius: var(--radius); padding: 15px 16px; margin-bottom: 11px;
  }
  .card.fresh { border-color: rgba(255,69,58,.35); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-title { font-size: 15.5px; font-weight: 600; }
  .badge {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; font-weight: 600;
  }
  .badge.dist { background: rgba(255,69,58,.16); color: #FF6961; }
  .badge.dist.far { background: rgba(255,159,10,.16); color: var(--amber); }
  .card-type { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .src {
    display: inline-block; font-size: 10.5px; padding: 3px 8px; border-radius: 7px;
    margin-top: 8px; font-weight: 600;
  }
  .src.user { background: rgba(255,255,255,.08); color: #C7C7CE; }
  .src.official { background: rgba(10,132,255,.16); color: #64B3FF; }
  /* source filter pills floating on map */
  .srcbar {
    position: absolute; top: calc(var(--topbar) + 10px); left: 14px; right: 14px; z-index: 1000;
    display: flex; gap: 8px;
  }
  .srcbar button {
    flex: 1; font-size: 12px; padding: 9px 4px; border-radius: 999px; font-family: inherit; font-weight: 600;
    border: 1px solid var(--hair); background: var(--glass); color: var(--muted);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .srcbar button.on { border-color: transparent; color: #fff; background: rgba(255,69,58,.9); }
  .card-meta { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .card-meta .ok { color: var(--green); }
  .vote-row { display: flex; gap: 8px; margin-top: 12px; }
  .vote-row button {
    flex: 1; font-size: 12.5px; padding: 9px; border-radius: 11px; font-weight: 600;
    border: 1px solid var(--hair); background: var(--surface-2); color: var(--text); font-family: inherit;
  }
  .vote-row button:active { background: #2A2B33; }
  .collapse-bar {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius); padding: 13px 16px;
    font-size: 13px; color: var(--muted); display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 11px; cursor: pointer;
  }

  /* route tab */
  #routePanel {
    position: absolute; top: calc(var(--topbar) + 10px); left: 14px; right: 14px; z-index: 1000;
  }
  #routePanel .row { display: flex; gap: 8px; }
  #destInput {
    flex: 1; font-size: 15px; padding: 12px 15px; border: 1px solid var(--hair);
    border-radius: 13px; font-family: inherit; color: var(--text);
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  #destInput::placeholder { color: var(--muted); }
  #routeBtn {
    background: var(--accent); color: #fff; border: none; border-radius: 13px;
    padding: 9px 18px; font-size: 14px; font-family: inherit; font-weight: 600;
  }
  #routeHint {
    font-size: 11.5px; color: var(--muted); margin-top: 8px; text-align: center;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 6px 12px; border-radius: 999px; display: inline-block;
    position: relative; left: 50%; transform: translateX(-50%);
  }
  #routeSummary {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1050;
    max-height: 56%; overflow-y: auto;
    background: var(--glass); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border-top: 1px solid var(--hair); border-radius: 22px 22px 0 0;
    padding: 16px 16px 110px; display: none;
  }
  #routeSummary h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .route-hit { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 13px; gap: 8px; }
  .route-hit:last-child { border-bottom: none; }
  .route-hit .t { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .route-opt {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 13px 15px; margin-bottom: 9px; border: 1px solid var(--hair);
    border-radius: 14px; cursor: pointer; background: var(--surface);
  }
  .route-opt.sel { border-color: var(--accent); background: rgba(255,69,58,.12); }
  .route-opt .ro-main { display: flex; flex-direction: column; gap: 3px; }
  .route-opt .ro-main b { font-size: 15px; font-weight: 600; }
  .route-opt .ro-sub { font-size: 12.5px; color: var(--muted); }
  .ro-badges { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .cpcount { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .cpcount.cp-some { background: rgba(255,69,58,.16); color: #FF6961; }
  .cpcount.cp-none { background: rgba(48,209,88,.16); color: var(--green); }
  .cpcount.cond { background: rgba(10,132,255,.16); color: #64B3FF; font-weight: 500; }
  .ro-listhead { font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  .nav-row { display: flex; gap: 8px; margin: 6px 0 2px; }
  .nav-btn {
    flex: 1; display: block; text-align: center; text-decoration: none;
    font-weight: 600; font-size: 14px; padding: 13px; border-radius: 13px;
  }
  .nav-btn.g { background: var(--blue); color: #fff; }
  .nav-btn.a { background: var(--surface-2); color: var(--text); border: 1px solid var(--hair); }

  /* bottom nav — floating pill */
  nav {
    position: absolute; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 50%; transform: translateX(-50%);
    z-index: 1100; display: flex; gap: 4px; padding: 6px;
    background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--hair); border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  nav button {
    background: none; border: none; padding: 8px 15px; border-radius: 999px;
    font-size: 10.5px; color: var(--muted); font-family: inherit; white-space: nowrap;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav button.active { color: #fff; background: rgba(255,255,255,.1); }
  nav button svg { width: 21px; height: 21px; }

  /* FAB */
  #fab {
    position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 82px); z-index: 1100;
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 14px 20px; font-size: 14px; font-weight: 600; font-family: inherit;
    box-shadow: 0 6px 20px rgba(255,69,58,.4); display: flex; align-items: center; gap: 7px;
  }

  /* report sheet */
  #sheet {
    position: absolute; inset: 0; z-index: 1300; background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-end;
  }
  #sheet.open { display: flex; }
  #sheetBody {
    background: var(--surface); border-radius: 24px 24px 0 0; width: 100%;
    max-height: 92%; display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--hair);
  }
  .grabber { width: 38px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); margin: 10px auto 2px; flex-shrink: 0; }
  #sheetBody h2 { font-size: 18px; font-weight: 600; padding: 8px 18px 4px; }
  #sheetBody .hint { font-size: 12.5px; color: var(--muted); padding: 0 18px 12px; }
  #pickWrap { position: relative; height: 220px; flex-shrink: 0; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%);
    z-index: 1000; pointer-events: none; font-size: 30px; line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.6));
  }
  .sheet-form { padding: 14px 18px 18px; overflow-y: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .chip {
    font-size: 12.5px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--hair); background: var(--surface-2); font-family: inherit; color: var(--text);
  }
  .chip.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sheet-form label { font-size: 13px; font-weight: 600; color: var(--muted); }
  #labelInput {
    width: 100%; font-size: 15px; padding: 12px 14px; border: 1px solid var(--hair);
    border-radius: 12px; font-family: inherit; margin: 10px 0 16px; background: var(--surface-2); color: var(--text);
  }
  #labelInput::placeholder { color: var(--muted); }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .cancel { flex: 1; background: var(--surface-2); border: 1px solid var(--hair); color: var(--text); border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit; }
  .sheet-actions .submit { flex: 2; background: var(--accent); color: #fff; border: none; border-radius: 13px; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit; }

  #toast {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px;
    background: rgba(40,40,46,.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: #fff; font-size: 13px; padding: 12px 20px; border: 1px solid var(--hair);
    border-radius: 999px; z-index: 1400; display: none; white-space: nowrap; max-width: 90%;
  }
  /* dark leaflet popups */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface-2); color: var(--text); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .leaflet-popup-content-wrapper { border-radius: 14px; border: 1px solid var(--hair); }
  .leaflet-popup-close-button { color: var(--muted) !important; }
  .pin-pop { font-size: 13px; line-height: 1.55; min-width: 195px; }
  .pin-pop b { font-size: 14.5px; font-weight: 600; }
  .pin-pop .meta { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
  .pin-pop .vr { display: flex; gap: 7px; }
  .pin-pop .vr button { flex: 1; font-size: 12px; padding: 8px; border-radius: 9px; border: 1px solid var(--hair); background: var(--surface); color: var(--text); font-family: inherit; font-weight: 600; }

  /* motion */
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pinPop {
    0% { opacity: 0; transform: translateY(-13px) scale(.3); }
    60% { transform: translateY(0) scale(1.15); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  #sheet.open { animation: fadeIn .18s ease; }
  #sheet.open #sheetBody { animation: sheetUp .34s cubic-bezier(.32,.72,0,1); }
  #routeSummary.show { animation: sheetUp .34s cubic-bezier(.32,.72,0,1); }
  .pin { transform-box: fill-box; transform-origin: center; animation: pinPop .5s cubic-bezier(.34,1.56,.64,1) both; }
  @media (prefers-reduced-motion: reduce) {
    #sheet.open, #sheet.open #sheetBody, #routeSummary.show, .pin { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>ด่าน</h1>
    <div class="sub">แจ้งเตือนช่วยกันจ้าาา</div>
  </div>
  <div id="locBadge">กำลังหาตำแหน่ง…</div>
</header>

<main>
  <div class="tab active" id="tab-map">
    <div class="srcbar" id="srcbar">
      <button data-src="user" class="on" onclick="toggleSrc('user',this)">👥 ผู้ใช้แจ้ง</button>
      <button data-src="official" class="on" onclick="toggleSrc('official',this)">🏛️ ข้อมูลทางการ</button>
    </div>
    <div id="map"></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--fresh)"></span>ไม่เกิน 1 ชม.</div>
      <div><span class="dot" style="background:var(--aging)"></span>1–3 ชม.</div>
      <div><span class="dot" style="background:var(--stale)"></span>เกิน 3 ชม.</div>
    </div>
  </div>

  <div class="tab" id="tab-feed">
    <div id="feedScroll"></div>
  </div>

  <div class="tab" id="tab-route">
    <div id="routePanel">
      <div class="row">
        <input id="destInput" placeholder="ไปไหน? เช่น สยามพารากอน" autocomplete="off">
        <button id="routeBtn">เช็คเส้นทาง</button>
      </div>
      <div id="routeHint">จากตำแหน่งปัจจุบัน · หรือแตะบนแผนที่เพื่อปักหมุดปลายทาง</div>
    </div>
    <div id="routeMap"></div>
    <div id="routeSummary"></div>
  </div>

  <button id="fab" onclick="openSheet()">＋ รายงานด่าน</button>

  <nav>
    <button data-tab="map" class="active" onclick="switchTab('map')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6l6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      แผนที่
    </button>
    <button data-tab="feed" onclick="switchTab('feed')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      รายการ
    </button>
    <button data-tab="route" onclick="switchTab('route')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h6"/></svg>
      เส้นทาง
    </button>
  </nav>

  <div id="sheet">
    <div id="sheetBody">
      <div class="grabber"></div>
      <h2>รายงานด่านตรงนี้</h2>
      <div class="hint">เลื่อนแผนที่ให้หมุดอยู่ตรงจุดที่เจอด่าน · เวลาใช้ตอนนี้อัตโนมัติ</div>
      <div id="pickWrap">
        <div id="pickMap"></div>
        <div id="crosshair">📍</div>
      </div>
      <div class="sheet-form">
        <label>ประเภทการตรวจ</label>
        <div class="chips" id="typeChips"></div>
        <label>สถานที่ (ไม่บังคับ)</label>
        <input id="labelInput" placeholder="เช่น หน้าโลตัส พระราม 2">
        <div class="sheet-actions">
          <button class="cancel" onclick="closeSheet()">ยกเลิก</button>
          <button class="submit" onclick="submitReport()">＋ ส่งรายงาน</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TYPES = ["ตั้งแล้ว ระวังด้วย","ใบขับขี่+หมวกกันน็อค","เช็คลมปาก","ควันดำ","เน้น 2 ล้อ","ส่องความเร็ว","ภาษี พ.ร.บ.","รถบรรทุก","จราจรติดขัด","ฝนตก","ทำถนน+ซ่อมแซม"];
const DEFAULT_LOC = [13.7649, 100.5383]; // อนุสาวรีย์ชัยฯ fallback
const ROUTE_BUFFER_M = 400;
// Paste a free OpenRouteService token here to enable reliable 2–3 route options.
// Empty = automatic fallback to the OSRM demo (usually returns only 1 route).
const ORS_KEY = "";

let userLoc = null;
let checkpoints = [];
let selType = TYPES[0];
let map, routeMap, pickMap;
let mapLayer = L.layerGroup(), routeCpLayer = L.layerGroup(), routeLines = L.layerGroup(), destMarker = null, userMarkers = [];
let destLatLng = null;
let routeData = [], selRoute = 0, lastDest = null;
let pinsAnimated = false;

const $ = id => document.getElementById(id);
const tileURL = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";
const tileAttr = "© OpenStreetMap · © CARTO";
const tileOpts = { attribution: tileAttr, subdomains: "abcd", maxZoom: 20 };

function initMaps() {
  map = L.map("map", { zoomControl: false }).setView(DEFAULT_LOC, 12);
  L.tileLayer(tileURL, tileOpts).addTo(map);
  mapLayer.addTo(map);

  routeMap = L.map("routeMap", { zoomControl: false }).setView(DEFAULT_LOC, 12);
  L.tileLayer(tileURL, tileOpts).addTo(routeMap);
  routeLines.addTo(routeMap);
  routeCpLayer.addTo(routeMap);
  new ResizeObserver(() => routeMap.invalidateSize()).observe($("routeMap"));
  new ResizeObserver(() => map.invalidateSize()).observe($("map"));
  routeMap.on("click", e => {
    destLatLng = e.latlng;
    $("destInput").value = "หมุดที่ปักไว้";
    if (destMarker) destMarker.remove();
    destMarker = L.marker(e.latlng).addTo(routeMap);
    buildRoute();
  });
}

function locate() {
  if (!navigator.geolocation) { userLoc = DEFAULT_LOC; onLocated(false); return; }
  navigator.geolocation.getCurrentPosition(
    p => { userLoc = [p.coords.latitude, p.coords.longitude]; onLocated(true); },
    () => { userLoc = DEFAULT_LOC; onLocated(false); },
    { timeout: 6000 }
  );
}

function onLocated(real) {
  $("locBadge").textContent = real ? "ตำแหน่งปัจจุบัน" : "อนุสาวรีย์ชัยฯ (ตัวอย่าง)";
  userMarkers.forEach(m => m.remove());
  userMarkers = [map, routeMap].map(m =>
    L.circleMarker(userLoc, { radius: 7, color: "#fff", weight: 2.5, fillColor: "#0A84FF", fillOpacity: 1 }).addTo(m)
  );
  map.setView(userLoc, 13);
  routeMap.setView(userLoc, 12);
  renderFeed();
}

function haversineM(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dp = (b[0]-a[0])*toR, dl = (b[1]-a[1])*toR;
  const h = Math.sin(dp/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function agoText(min) {
  if (min < 1) return "เมื่อสักครู่";
  if (min < 60) return `${min} นาทีที่แล้ว`;
  const h = Math.floor(min/60), m = min%60;
  return m ? `${h} ชม. ${m} นาทีที่แล้ว` : `${h} ชม.ที่แล้ว`;
}
function distText(m) { return m < 1000 ? `${Math.round(m)} ม.` : `${(m/1000).toFixed(1)} กม.`; }

const SRC = {
  user:    { label: "ผู้ใช้แจ้ง",    ring: "#FFFFFF" },
  official:{ label: "ข้อมูลทางการ", ring: "#0A84FF" },
};
let srcOn = { user: true, official: true };

function styleFor(cp) {
  const ring = (SRC[cp.source] || SRC.user).ring;
  const w = cp.source === "user" ? 2 : 3;
  if (cp.age_minutes <= 60) return { color: ring, fillColor: "#FF453A", fillOpacity: 1, radius: 11, weight: w };
  if (cp.age_minutes <= 180) return { color: ring, fillColor: "#FF9F0A", fillOpacity: .9, radius: 9, weight: w };
  return { color: ring, fillColor: "#8E8E93", fillOpacity: .7, radius: 7, weight: w };
}

function srcBadge(cp) {
  const s = SRC[cp.source] || SRC.user;
  const name = cp.source === "official" ? (cp.source_name || s.label) : s.label;
  return `<span class="src ${cp.source}">${name}</span>`;
}

async function loadCheckpoints() {
  const res = await fetch("/api/checkpoints");
  const data = await res.json();
  checkpoints = data.checkpoints.filter(c => c.status !== "cleared");
  renderMap();
  renderFeed();
}

function popupHtml(cp) {
  const conf = cp.source === "official"
    ? `อัปเดต ${agoText(cp.age_minutes)}`
    : `ยืนยันล่าสุด ${agoText(cp.age_minutes)} · ✓ ${cp.confirms} คน${cp.reports>1?` · รายงาน ${cp.reports} ครั้ง`:""}`;
  const votes = cp.source === "official" ? "" :
    `<div class="vr"><button onclick="vote(${cp.id},true)">ยังอยู่</button><button onclick="vote(${cp.id},false)">ไม่อยู่แล้ว</button></div>`;
  return `<div class="pin-pop"><b>${cp.label}</b>
    <div class="meta">${cp.type}<br>${conf}</div>${srcBadge(cp)}${votes}</div>`;
}

function renderMap() {
  mapLayer.clearLayers();
  const shown = checkpoints.filter(cp => srcOn[cp.source]);
  const animate = !pinsAnimated && shown.length > 0;
  shown.forEach(cp => {
    L.circleMarker([cp.lat, cp.lng], { ...styleFor(cp), className: animate ? "pin" : "" })
      .bindPopup(popupHtml(cp)).addTo(mapLayer);
  });
  if (animate) {
    pinsAnimated = true;
    document.querySelectorAll("#map path.pin").forEach((p, i) => {
      p.style.animationDelay = Math.min(i * 45, 500) + "ms";
    });
  }
}

function toggleSrc(src, el) {
  srcOn[src] = !srcOn[src];
  el.classList.toggle("on", srcOn[src]);
  renderMap();
}

function cardHtml(cp, dist) {
  const fresh = cp.age_minutes <= 60;
  const official = cp.source === "official";
  const distBadge = dist == null ? "" :
    `<span class="badge dist ${dist > 5000 ? "far" : ""}">${distText(dist)}</span>`;
  const meta = official
    ? `<span>🕐 อัปเดต ${agoText(cp.age_minutes)}</span>`
    : `<span>🕐 ${agoText(cp.age_minutes)}</span><span class="ok">✓ ยืนยัน ${cp.confirms} คน</span>`;
  const votes = official ? "" :
    `<div class="vote-row">
      <button onclick="vote(${cp.id},true)">ยังอยู่</button>
      <button onclick="vote(${cp.id},false)">ไม่อยู่แล้ว</button>
    </div>`;
  return `<div class="card ${fresh ? "fresh" : ""}">
    <div class="card-top"><span class="card-title">${cp.label}</span>${distBadge}</div>
    <div class="card-type">${cp.type}${cp.reports > 1 && !official ? ` · รายงาน ${cp.reports} ครั้งรวมกัน` : ""}</div>
    <div>${srcBadge(cp)}</div>
    <div class="card-meta">${meta}</div>
    ${votes}</div>`;
}

let staleOpen = false;
function renderFeed() {
  const el = $("feedScroll");
  const withDist = checkpoints.map(cp => ({
    cp, dist: userLoc ? haversineM(userLoc, [cp.lat, cp.lng]) : null
  }));
  const active = withDist.filter(x => x.cp.status === "active")
    .sort((a,b) => (a.dist ?? 0) - (b.dist ?? 0));
  const stale = withDist.filter(x => x.cp.status === "stale")
    .sort((a,b) => a.cp.age_minutes - b.cp.age_minutes);

  let html = `<div class="section-label">ยังเปิดอยู่ · เรียงตามระยะทาง (${active.length})</div>`;
  html += active.length
    ? active.map(x => cardHtml(x.cp, x.dist)).join("")
    : `<div class="card" style="text-align:center;color:var(--muted)">ยังไม่มีด่านที่เปิดอยู่ใกล้คุณ 🎉</div>`;
  html += `<div class="collapse-bar" onclick="staleOpen=!staleOpen;renderFeed()">
      <span>เกิน 3 ชม. อาจเลิกแล้ว (${stale.length} รายการ)</span><span>${staleOpen ? "▲" : "▼"}</span></div>`;
  if (staleOpen) html += stale.map(x => cardHtml(x.cp, x.dist)).join("");
  el.innerHTML = html;
}

async function vote(id, still) {
  await fetch(`/api/checkpoints/${id}/vote`, {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ still })
  });
  toast(still ? "ขอบคุณ! ยืนยันแล้ว ✓" : "รับทราบ ถ้ามีคนยืนยันเพิ่มจะเอาออกให้");
  loadCheckpoints();
}

/* ---------- route tab ---------- */
function ptSegDistM(p, a, b) {
  const toR = Math.PI/180, latR = p[0]*toR;
  const mPerLat = 111320, mPerLng = 111320*Math.cos(latR);
  const px = (p[1]-a[1])*mPerLng, py = (p[0]-a[0])*mPerLat;
  const bx = (b[1]-a[1])*mPerLng, by = (b[0]-a[0])*mPerLat;
  const len2 = bx*bx + by*by;
  let t = len2 ? (px*bx + py*by)/len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const dx = px - t*bx, dy = py - t*by;
  return { d: Math.sqrt(dx*dx + dy*dy), t };
}

function distToRoute(cp, coords) {
  let best = Infinity, along = 0, acc = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const segLen = haversineM(coords[i], coords[i+1]);
    const r = ptSegDistM([cp.lat, cp.lng], coords[i], coords[i+1]);
    if (r.d < best) { best = r.d; along = acc + r.t*segLen; }
    acc += segLen;
  }
  return { dist: best, along };
}

async function geocode(q) {
  const c = userLoc || DEFAULT_LOC;
  const vb = `${c[1]-0.4},${c[0]-0.4},${c[1]+0.4},${c[0]+0.4}`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=th&viewbox=${vb}&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, { headers: { "Accept-Language": "th" } });
  const js = await res.json();
  return js.length ? L.latLng(+js[0].lat, +js[0].lon) : null;
}

// Returns [{coords:[[lat,lng]...], km, mins}] in the ENGINE's order (by travel time).
// Uses OpenRouteService when ORS_KEY is set (reliable 2–3 alternatives), else the
// OSRM demo. Never orders by checkpoints — that happens nowhere.
async function fetchRoutes(o, dest) {
  if (ORS_KEY) {
    try {
      const res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car/geojson", {
        method: "POST",
        headers: { "Authorization": ORS_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({
          coordinates: [[o[1], o[0]], [dest.lng, dest.lat]],
          alternative_routes: { target_count: 3, share_factor: 0.6, weight_factor: 1.6 },
        }),
      });
      if (res.ok) {
        const js = await res.json();
        if (js.features && js.features.length) {
          return js.features.map(f => ({
            coords: f.geometry.coordinates.map(c => [c[1], c[0]]),
            km: f.properties.summary.distance / 1000,
            mins: Math.round(f.properties.summary.duration / 60),
          }));
        }
      }
    } catch (e) { /* fall through to OSRM */ }
  }
  const url = `https://router.project-osrm.org/route/v1/driving/${o[1]},${o[0]};${dest.lng},${dest.lat}?overview=full&geometries=geojson&alternatives=3`;
  const js = await (await fetch(url)).json();
  if (!js.routes || !js.routes.length) return [];
  return js.routes.map(rt => ({
    coords: rt.geometry.coordinates.map(c => [c[1], c[0]]),
    km: rt.distance / 1000,
    mins: Math.round(rt.duration / 60),
  }));
}

async function buildRoute() {
  if (!destLatLng) {
    const q = $("destInput").value.trim();
    if (!q) return toast("พิมพ์ปลายทาง หรือแตะบนแผนที่");
    toast("กำลังค้นหา…");
    destLatLng = await geocode(q);
    if (!destLatLng) return toast("หาปลายทางไม่เจอ ลองแตะบนแผนที่แทน");
    if (destMarker) destMarker.remove();
    destMarker = L.marker(destLatLng).addTo(routeMap);
  }
  const o = userLoc || DEFAULT_LOC;
  toast("กำลังคำนวณเส้นทาง…");
  let raw;
  try { raw = await fetchRoutes(o, destLatLng); }
  catch { return toast("เชื่อมต่อบริการเส้นทางไม่ได้"); }
  if (!raw.length) return toast("หาเส้นทางไม่ได้");

  // Routes come from the engine in its own order (by travel time). We annotate each
  // with the checkpoints that fall on it — we never reorder by checkpoint count or
  // feed checkpoints into the routing itself.
  const active = checkpoints.filter(c => c.status === "active");
  routeData = raw.map(rt => {
    const hits = [];
    active.forEach(cp => {
      const r = distToRoute(cp, rt.coords);
      if (r.dist <= ROUTE_BUFFER_M) hits.push({ cp, along: r.along });
    });
    hits.sort((a, b) => a.along - b.along);
    return { coords: rt.coords, hits, km: rt.km, mins: rt.mins };
  });
  selRoute = 0;
  lastDest = { lat: destLatLng.lat, lng: destLatLng.lng };
  destLatLng = null;
  drawRoutes();
  renderRouteSummary();
  const sum = $("routeSummary");
  sum.classList.remove("show"); void sum.offsetWidth; sum.classList.add("show");
  setTimeout(() => {
    routeMap.invalidateSize();
    const b = L.latLngBounds(routeData.flatMap(r => r.coords));
    routeMap.fitBounds(b, { padding: [30, 30] });
  }, 250);
}

function drawRoutes() {
  routeLines.clearLayers();
  // Draw unselected first so the selected route sits on top.
  routeData.forEach((r, i) => {
    if (i === selRoute) return;
    L.polyline(r.coords, { color: "#5A5A62", weight: 4, opacity: .6 })
      .on("click", () => { selRoute = i; drawRoutes(); renderRouteSummary(); })
      .addTo(routeLines);
  });
  const sel = routeData[selRoute];
  L.polyline(sel.coords, { color: "#0A84FF", weight: 6, opacity: .95 }).addTo(routeLines);

  routeCpLayer.clearLayers();
  sel.hits.forEach(h => {
    L.circleMarker([h.cp.lat, h.cp.lng], { ...styleFor(h.cp), radius: 13, weight: 3 })
      .bindPopup(popupHtml(h.cp)).addTo(routeCpLayer);
  });
}

function renderRouteSummary() {
  const sum = $("routeSummary");
  sum.style.display = "block";
  const opts = routeData.map((r, i) => {
    const nCp = r.hits.filter(h => h.cp.source !== "official").length;
    const nCond = r.hits.filter(h => h.cp.source === "official").length;
    const cpTxt = nCp ? `ด่าน ${nCp} จุด` : "ไม่มีด่าน";
    const cpCls = nCp ? "cp-some" : "cp-none";
    const condPill = nCond ? `<span class="cpcount cond">สภาพถนน ${nCond}</span>` : "";
    return `<div class="route-opt ${i === selRoute ? "sel" : ""}" onclick="selRoute=${i};drawRoutes();renderRouteSummary()">
        <div class="ro-main">
          <b>เส้นทางที่ ${i + 1}</b>
          <span class="ro-sub">~${r.mins} นาที · ${r.km.toFixed(1)} กม.</span>
        </div>
        <div class="ro-badges"><span class="cpcount ${cpCls}">${cpTxt}</span>${condPill}</div>
      </div>`;
  }).join("");

  const sel = routeData[selRoute];
  const list = sel.hits.length
    ? sel.hits.map(h => `<div class="route-hit">
          <div><b>${h.cp.label}</b> ${srcBadge(h.cp)}<div class="t">${h.cp.type} · ${h.cp.source === "official" ? "อัปเดต" : "ยืนยันล่าสุด"} ${agoText(h.cp.age_minutes)}</div></div>
          <span class="badge dist">กม.ที่ ${(h.along / 1000).toFixed(1)}</span>
        </div>`).join("")
    : `<div class="route-hit" style="color:var(--muted)">ไม่มีด่านที่ผู้ใช้แจ้งบนเส้นทางนี้</div>`;

  // Hand off to Google/Apple Maps for turn-by-turn. Destination only — the nav app
  // uses the phone's live GPS as the start. We pass destination, not our route
  // geometry (deep links can't carry a full path), so the nav app routes its own way.
  const navBtns = lastDest ? `<div class="ro-listhead">นำทางต่อด้วย</div>
    <div class="nav-row">
      <a class="nav-btn g" href="https://www.google.com/maps/dir/?api=1&destination=${lastDest.lat},${lastDest.lng}&travelmode=driving" target="_blank" rel="noopener">Google Maps ↗</a>
      <a class="nav-btn a" href="https://maps.apple.com/?daddr=${lastDest.lat},${lastDest.lng}&dirflg=d" target="_blank" rel="noopener">Apple Maps ↗</a>
    </div>` : "";

  sum.innerHTML = `<h3>เลือกเส้นทาง <span style="font-weight:400;color:var(--muted);font-size:11.5px">· เรียงตามเวลาเดินทาง</span></h3>
    ${opts}
    <div class="ro-listhead">สิ่งที่อยู่บนเส้นทางที่ ${selRoute + 1}</div>
    ${list}
    ${navBtns}`;
}

/* ---------- report sheet ---------- */
function openSheet() {
  $("sheet").classList.add("open");
  if (!pickMap) {
    pickMap = L.map("pickMap", { zoomControl: false }).setView(userLoc || DEFAULT_LOC, 16);
    L.tileLayer(tileURL, tileOpts).addTo(pickMap);
  } else {
    pickMap.setView(userLoc || DEFAULT_LOC, 16);
  }
  setTimeout(() => pickMap.invalidateSize(), 150);
}
function closeSheet() { $("sheet").classList.remove("open"); }

async function submitReport() {
  const c = pickMap.getCenter();
  const res = await fetch("/api/checkpoints", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ lat: c.lat, lng: c.lng, type: selType, label: $("labelInput").value })
  });
  const js = await res.json();
  closeSheet();
  $("labelInput").value = "";
  toast(js.merged ? "มีคนรายงานจุดนี้แล้ว — นับเป็นการยืนยัน ✓" : "ส่งรายงานแล้ว ขอบคุณ! 🙏");
  loadCheckpoints();
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 2600);
}

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.id === "tab-" + name));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  $("fab").style.display = name === "route" ? "none" : "flex";
  setTimeout(() => {
    if (name === "map") map.invalidateSize();
    if (name === "route") routeMap.invalidateSize();
  }, 60);
}

$("typeChips").innerHTML = TYPES.map(t =>
  `<button class="chip ${t===selType?"sel":""}" onclick="pickType(this,'${t}')">${t}</button>`).join("");
function pickType(el, t) {
  selType = t;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("sel"));
  el.classList.add("sel");
}
$("routeBtn").onclick = () => { destLatLng = null; buildRoute(); };
$("destInput").addEventListener("keydown", e => { if (e.key === "Enter") { destLatLng = null; buildRoute(); } });

initMaps();
locate();
loadCheckpoints();
setInterval(loadCheckpoints, 60000);
</script>
