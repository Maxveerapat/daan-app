<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* ============ Design system — modelled on JodNai (jodnai.com) ============
     Navy map; one persistent bottom panel (solid near-black, big radius, inset) that holds the
     list, the detail view and the tab bar; solid dark surfaces with hairline borders; blue solid
     primary CTA, outlined secondary; green for good values, red/orange for warnings. Glass only on
     things that float over the map (tab bar, map controls, top pills). Font: Google Sans (TH+EN). */
  :root {
    --bg: #111214;
    --sheet: #1B1C1E;
    --s1: #232528;
    --s2: #2C2E32;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.12);
    --text: #F2F2F3;
    --muted: #9B9EA4;
    --faint: #6E7177;
    --blue: #2D5BFF;
    --blue-t: #7EA3FF;
    --green: #5CCB8A;
    --green-bg: #1C3328;
    --red: #FF6B5A;
    --amber: #FFB340;
    --yellow: #FFD23F;
    --fresh: #FF5A4E;
    --aging: #FFB340;
    --stale: #7A7D84;
    --map-bg: #2B3150;
    --glass: rgba(30,32,40,.62);
    --glass-blue: rgba(52,70,140,.55);
    --panel-gap: 10px;
    --cp-ic: var(--cp-ic);     /* checkpoint icon/text accent */
    --inc-ic: #FFD23F;    /* incident icon/text accent */
    --on-bg: var(--on-bg);     /* selected segment on a --s2 track */
  }
  /* ===== Light theme (toggle in the logo pill; saved per device) ===== */
  :root[data-theme="light"] {
    --bg: #EEF0F3; --sheet: #FFFFFF; --s1: #F1F2F5; --s2: #E5E7EB;
    --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.14);
    --text: #15171A; --muted: #5E626A; --faint: #8A8E96;
    --blue-t: #2D5BFF; --green: #17894B; --green-bg: #E3F4E9; --red: #D63A2B; --amber: #B86E00; --yellow: #A87B00;
    --map-bg: #E9ECF1; --glass: rgba(255,255,255,.8); --glass-blue: rgba(45,91,255,.9);
    --cp-ic: #E0483A; --inc-ic: #B98800; --on-bg: #FFFFFF;
  }
  :root[data-theme="light"] body { color-scheme: light; }
  :root[data-theme="light"] .mapctl { background: #FFFFFF; border: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  :root[data-theme="light"] .mapctl button { color: #1A73E8; }
  :root[data-theme="light"] #pickLocate { background: #FFFFFF; color: #1A73E8; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  :root[data-theme="light"] .grabber { background: rgba(0,0,0,.18); }
  :root[data-theme="light"] { --ib-label: #3E7A57; }
  :root[data-theme="light"] #panel nav { background: rgba(255,255,255,.9); }
  :root[data-theme="light"] #panel nav button.active { background: #E8EEFF; }
  :root[data-theme="light"] #panel { box-shadow: 0 -4px 24px rgba(0,0,0,.12); }
  :root[data-theme="light"] .search-wrap, :root[data-theme="light"] .trip, :root[data-theme="light"] #suggest { box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  :root[data-theme="light"] #installBar { background: rgba(255,255,255,.97); }
  :root[data-theme="light"] .tile.big.cp { background: linear-gradient(160deg, #FDE3E0, #FFF1EF); }
  :root[data-theme="light"] .tile.big.inc { background: linear-gradient(160deg, #FFF1C9, #FFF8E3); }
  :root[data-theme="light"] .cnt.cp, :root[data-theme="light"] .cat-tag.cp, :root[data-theme="light"] .cpcount.cp-some { background: rgba(214,58,43,.1); }
  :root[data-theme="light"] .cnt.inc, :root[data-theme="light"] .cat-tag.inc, :root[data-theme="light"] .cpcount.inc-some { background: rgba(185,136,0,.12); }
  :root[data-theme="light"] #panel.tint-cp { background: radial-gradient(120% 60% at 0% 0%, rgba(214,58,43,.08), transparent 60%), var(--sheet); }
  :root[data-theme="light"] #panel.tint-inc { background: radial-gradient(120% 60% at 0% 0%, rgba(185,136,0,.1), transparent 60%), var(--sheet); }
  :root[data-theme="light"] .route-opt.sel { background: #EAF0FF; }
  :root[data-theme="light"] .leaflet-control-attribution { background: rgba(255,255,255,.7) !important; color: #6b6f78 !important; }
  :root[data-theme="light"] .leaflet-control-attribution a { color: #4c5160 !important; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg); color: var(--text);
    position: relative; max-width: 480px; margin: 0 auto; height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, .row-t, .row-s, .dt-sub, .note, #camCheck, #toast { text-wrap: balance; }
  .nw { white-space: nowrap; }

  main { position: absolute; inset: 0; overflow: hidden; }
  .tab { position: absolute; inset: 0; display: none; }
  .tab.active { display: block; }
  #map, #routeMap { position: absolute; inset: 0; }
  #pickMap { position: absolute; inset: 0; }
  .leaflet-container { background: var(--map-bg); font-family: inherit; }
  .leaflet-control-attribution { background: rgba(20,22,35,.5) !important; color: #7d84a3 !important; font-size: 9px !important; padding: 0 6px !important; }
  .leaflet-control-attribution a { color: #9aa2c4 !important; }

  /* ---- floating over the map ---- */
  .brand {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; z-index: 900;
    display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line-2); font-weight: 700; font-size: 17px;
  }
  .brand { padding: 4px 6px 4px 12px; background: #111214; -webkit-backdrop-filter: none; backdrop-filter: none; } /* solid: matches the logo knockout */
  .logo-img { height: 34px; width: auto; display: block; }
  .wordmark .wm { height: 21px; width: auto; display: block; }
  .mapctl {
    position: absolute; right: 2px; bottom: calc(100% + 12px); z-index: 2; display: flex; flex-direction: column;
    border-radius: 999px; overflow: hidden; background: var(--glass-blue);
    -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(160,180,255,.22); box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  #panel.full .mapctl, #panel.fitdetail .mapctl { display: none; }
  .mapctl button { width: 52px; height: 52px; border: none; background: none; display: flex; align-items: center; justify-content: center; color: #fff; }
  .mapctl button + button { border-top: 1px solid rgba(255,255,255,.14); }
  .mapctl svg { width: 22px; height: 22px; }

  /* ---- legend (inside the panel) ---- */
  .rec-legend { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
  .rec-legend > span { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .rec-legend i { width: 9px; height: 9px; border-radius: 50%; }
  .leg-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: -4px 0 10px; font-size: 12px; }
  .seg-ic { display: inline-flex; width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
  .seg-ic svg { width: 100%; height: 100%; }
  .seg-ic.cp { color: var(--cp-ic); } .seg-ic.inc { color: var(--inc-ic); }
  /* two-option segmented toggles: active option filled, the other outlined */
  .tog { display: inline-flex; margin-left: 6px; border: 1.5px solid rgba(255,255,255,.55); border-radius: 999px; padding: 0; overflow: hidden; }
  .tog button { height: 28px; min-width: 34px; padding: 0 9px; border: none; background: transparent; color: #fff; font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; border-radius: 999px; }
  .tog button svg { width: 15px; height: 15px; }
  .tog button.on { background: #fff; color: #111214; }
  .brand #themeBtn { margin-left: 6px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); color: #fff; display: flex; align-items: center; justify-content: center; }
  .brand #themeBtn svg { width: 16px; height: 16px; }
  .brand #refreshBtn { color: #fff; }
  .brand #langBtn { color: #fff; }
  .brand #refreshBtn { margin-left: 6px; width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; }
  .brand #refreshBtn svg { width: 16px; height: 16px; }
  .brand #refreshBtn.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand #langBtn { margin-left: 4px; height: 30px; padding: 0 11px; border-radius: 999px; border: none; background: rgba(255,255,255,.12); font-size: 12.5px; font-weight: 700; }
  .lg-i { display: flex; align-items: center; gap: 5px; color: #D7DAE4; }
  .lg-i i { width: 9px; height: 9px; border-radius: 50%; }
  .mk-s { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 999px; background: #1E1F23; font-weight: 700; font-size: 12px; border: 1.5px solid rgba(255,255,255,.16); }
  .mk-s .ic, .mk .ic { display: inline-flex; width: 15px; height: 15px; }
  .mk-s .ic svg, .mk .ic svg { width: 100%; height: 100%; }
  .mk-s.cp .ic, .mk.cp .ic { color: #FF8A7E; }
  .mk-s.inc, .mk.inc { border-color: var(--yellow); }
  .mk-s.inc .ic, .mk.inc .ic { color: var(--yellow); }

  /* ---- map pins: dark pill labels (JodNai style) ---- */
  .mk-wrap { background: none; border: none; }
  .mk {
    position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px; white-space: nowrap;
    background: #1E1F23; color: #fff; font-size: 13px; font-weight: 700; padding: 6px 11px 6px 8px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.14); box-shadow: 0 3px 10px rgba(0,0,0,.45); line-height: 1;
  }
  .mk i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .mk.inc { background: #2A2614; }
  .mk.stale { opacity: .6; }
  .mk.big, .mk.sel { border-color: #fff; transform: translate(-50%, -50%) scale(1.08); z-index: 2; }
  .mk.ghost { opacity: .45; }
  .mk { padding: 5px 7px 5px 6px; gap: 4px; }
  .mk .ic { width: 18px; height: 18px; }
  .mk.cp .ic { color: #FF8A7E; } .mk.inc .ic { color: #FFD23F; }
  .chip { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .chip.wide { grid-column: 1 / -1; }
  .chip-ic { display: inline-flex; width: 17px; height: 17px; flex-shrink: 0; }
  .chip-ic svg { width: 100%; height: 100%; }
  .chip.cp .chip-ic { color: var(--cp-ic); } .chip.inc .chip-ic { color: var(--inc-ic); }
  .chip.sel .chip-ic { color: #fff; }
  .mk.dot { padding: 0; width: 18px; height: 18px; justify-content: center; border-width: 2px; }
  .mk.dot i { width: 8px; height: 8px; }
  .mk.dot.inc { border-radius: 4px; transform: translate(-50%, -50%) rotate(45deg); }

  /* ---- persistent bottom panel ---- */
  #panel {
    position: absolute; left: var(--panel-gap); right: var(--panel-gap); bottom: calc(env(safe-area-inset-bottom) + var(--panel-gap)); z-index: 1000;
    height: var(--collapsed, 210px); display: flex; flex-direction: column;
    background: var(--sheet); border-radius: 34px; border: 1px solid var(--line);
    box-shadow: 0 -6px 30px rgba(0,0,0,.35); transition: height .32s cubic-bezier(.32,.72,0,1);
  }
  #panel.full { height: calc(100% - env(safe-area-inset-top) - 76px); }
  #panel.fitdetail { height: var(--detail-h, 70%); }
  #panel.fitdetail .pv { touch-action: none; overflow: hidden; }
  #panel.fitdetail.dt-scroll .pv { touch-action: pan-y; overflow-y: auto; }

  /* Not full: content drags the panel (no scrolling, no browser overscroll). Full: content scrolls. */
  #panel .pv { overscroll-behavior: contain; }
  #panel:not(.full) .pv { touch-action: none; overflow: hidden; }
  html, body { overscroll-behavior: none; }
  #panel.dragging { transition: none; }
  #panel.tint-cp { background: radial-gradient(120% 60% at 0% 0%, rgba(255,90,78,.16), transparent 60%), var(--sheet); }
  #panel.tint-inc { background: radial-gradient(120% 60% at 0% 0%, rgba(255,200,60,.14), transparent 60%), var(--sheet); }
  .grab { padding: 8px 0 2px; touch-action: none; cursor: grab; flex-shrink: 0; }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); margin: 0 auto; }
  .pv { position: relative; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px 12px; display: none; }
  .pv.on { display: block; }

  .p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
  .p-head > div:first-child { min-width: 0; }
  .p-head h2 { font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .p-sub { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtns { display: flex; gap: 8px; flex-shrink: 0; }
  .ibtn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--s1); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .ibtn svg { width: 18px; height: 18px; }

  /* segmented control */
  .seg { display: flex; padding: 4px; border-radius: 999px; background: var(--s1); gap: 2px; }
  .seg button { flex: 1; border: none; background: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 7px 6px; border-radius: 999px; white-space: nowrap; }
  :root[data-theme="light"] .seg button.on { background: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .seg button.on { background: var(--s2); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.35); }

  /* list rows */
  .rows { margin: 8px -18px 0; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 18px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:active { background: rgba(255,255,255,.03); }
  .tile {
    width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--s1); border: 1px solid var(--line);
  }
  .tile svg { width: 22px; height: 22px; }
  .tile.cp { color: var(--cp-ic); } .tile.inc { color: var(--inc-ic); }

  .tile.big.cp { background: linear-gradient(160deg, #3A1A18, #24171A); border-color: rgba(255,120,110,.25); }
  .tile.big.inc { background: linear-gradient(160deg, #3A3215, #24211A); border-color: rgba(255,210,63,.25); }
  .row-main { flex: 1; min-width: 0; }
  .row-t { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-s { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-s .live { color: var(--red); font-weight: 600; }
  .row-v .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .row-s .cat-tag { font-size: 11.5px; padding: 2px 7px; margin-right: 5px; }
  .row-v { font-size: 16px; font-weight: 500; text-align: right; flex-shrink: 0; }
  .row-v small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .empty { text-align: center; color: var(--muted); font-size: 15px; padding: 34px 10px; }
  .more { display: flex; justify-content: space-between; padding: 14px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; cursor: pointer; }

  /* detail view */
  .dt-head { display: flex; gap: 12px; align-items: center; margin: 0 0 12px; }
  .dt-head .main { flex: 1; min-width: 0; }
  .dt-head h2 { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .dt-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .dt-head .ibtn { width: 38px; height: 38px; font-size: 14px; }
  .tile.big { width: 46px; height: 46px; border-radius: 14px; }
  .tile.big svg { width: 22px; height: 22px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 18px; }
  .chip-link {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 13px 16px; border-radius: 999px;
    background: var(--s1); border: none; font-size: 15px; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden;
  }
  .chip-link::after { content: "›"; color: var(--muted); font-size: 20px; line-height: 1; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
  .st { display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: center; background: var(--s1); border-radius: 14px; padding: 9px 11px; }
  .st i { grid-row: span 2; display: flex; color: var(--muted); } .st i svg { width: 20px; height: 20px; }
  .st i .hd-inline { width: 20px; height: 20px; }
  .st b { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vote { display: flex; align-items: center; justify-content: center; gap: 7px; height: 42px; border-radius: 999px; border: none; font-size: 14.5px; font-weight: 600; }
  .vote svg { width: 18px; height: 18px; }
  .vote.yes { background: rgba(30,142,62,.14); color: #1E8E3E; } .vote.no { background: rgba(217,48,37,.12); color: #D93025; }
  :root:not([data-theme="light"]) .vote.yes { background: rgba(92,203,138,.16); color: #81C995; }
  :root:not([data-theme="light"]) .vote.no { background: rgba(255,107,90,.16); color: #F28B82; }
  .vote:active { filter: brightness(.95); }
  h3.sec { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  .infobox { background: var(--green-bg); border-radius: 16px; padding: 8px 14px; color: var(--green); font-size: 14px; }
  .infobox .ln { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .infobox .ln span:first-child { color: var(--ib-label, #9FD9B8); }
  .table { background: var(--s1); border-radius: 18px; overflow: hidden; margin-top: 10px; }
  .table .tr { display: flex; justify-content: space-between; gap: 10px; padding: 13px 16px; font-size: 15px; }
  .table .tr + .tr { border-top: 1px solid var(--line); }
  .table .tr span:first-child { color: var(--muted); }
  .vote2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-dark { height: 40px; border-radius: 999px; border: none; background: var(--s1); font-size: 14px; font-weight: 600; }
  .btn-dark:active { background: var(--s2); }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border-radius: 999px; border: none;
    background: var(--blue); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; margin-top: 14px;
  }
  .cta svg { width: 18px; height: 18px; }
  .btn-outline {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border-radius: 999px;
    border: 1px solid var(--line-2); background: none; color: var(--text); font-size: 16px; font-weight: 500; text-decoration: none; margin-top: 8px;
  }
  .btn-outline svg { width: 19px; height: 19px; }
  .foot { display: flex; align-items: center; margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .foot > * { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: none; border: none; color: var(--muted); font-size: 14px; text-decoration: none; padding: 8px; }
  .foot > * + * { border-left: 1px solid var(--line-2); }
  .foot svg { width: 16px; height: 16px; }

  /* tab bar inside the panel (glass) */
  .ro-hits { margin: -2px 0 10px 12px; padding-left: 10px; border-left: 2px solid var(--blue); }
  .ro-hits.empty { color: var(--muted); font-size: 13px; padding: 4px 0 4px 10px; }

  .pchip i { display: inline-flex; width: 18px; height: 18px; color: #1A73E8; } .pchip i svg { width: 100%; height: 100%; }
  .pchip.add { color: #1A73E8; font-weight: 600; }
  .pchip.sug { background: #E1F5FE; color: #0B4F6C; box-shadow: none; } .pchip.sug i { color: #0B4F6C; }
  :root:not([data-theme="light"]) .pchip.sug { background: #183447; color: #A8DBF5; } :root:not([data-theme="light"]) .pchip.sug i { color: #A8DBF5; }
  .sg-pin.saved { background: #E8F0FE; color: #1A73E8; } .sg-pin.saved svg { width: 17px; height: 17px; }
  .pl-wrap { background: none; border: none; }

  .pl-mk i { width: 30px; height: 30px; border-radius: 50%; background: #1A73E8; color: #fff; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .pl-mk i svg { width: 16px; height: 16px; }
  .pl-mk span { font-size: 13px; font-weight: 700; color: #1A73E8; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  :root:not([data-theme="light"]) .pl-mk span { color: #8AB4F8; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #placeSheet { position: absolute; inset: 0; z-index: 1350; background: rgba(0,0,0,.45); display: none; align-items: flex-end; padding: 0 var(--panel-gap) calc(env(safe-area-inset-bottom) + var(--panel-gap)); }
  #placeSheet.open { display: flex; animation: fadeIn .18s ease; }
  .ps-body { width: 100%; height: calc(100% - env(safe-area-inset-top) - 8px); background: var(--sheet); border-radius: 34px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); }
  #placeSheet.open .ps-body { animation: sheetUp .34s cubic-bezier(.32,.72,0,1); }
  .ps-search { position: relative; margin: 0 12px 10px; display: flex; align-items: center; height: 46px; border-radius: 999px; background: var(--s1); }
  .ps-search i { display: flex; width: 18px; height: 18px; margin: 0 10px 0 16px; color: var(--muted); } .ps-search i svg { width: 100%; height: 100%; }
  .ps-search input { flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: none; font-size: 16px; }
  .ps-search input::placeholder { color: var(--muted); }
  #plSug { display: none; position: absolute; left: 0; right: 0; top: 52px; z-index: 1100; max-height: 46vh; overflow-y: auto; background: var(--sheet); border: 1px solid var(--line-2); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  #plSug.open { display: block; }
  .ps-head { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; padding: 12px 12px 8px; }
  .ps-head h2 { text-align: center; font-size: 19px; font-weight: 700; }
  #placeWrap { position: relative; height: 38%; min-height: 180px; margin: 0 12px; border-radius: 18px; overflow: hidden; flex-shrink: 0; }
  #placeMap { position: absolute; inset: 0; }
  .ps-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 1000; line-height: 0; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .ps-hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 1000; font-size: 12.5px; white-space: nowrap; color: #fff; background: rgba(20,22,30,.75); padding: 6px 12px; border-radius: 999px; pointer-events: none; }
  .ps-field { position: relative; display: block; margin: 18px 14px 0; border: 2px solid #3C7A89; border-radius: 14px; padding: 0 14px; }
  .ps-field span { position: absolute; top: -10px; left: 12px; padding: 0 6px; background: var(--sheet); color: #3C7A89; font-size: 13px; }
  :root:not([data-theme="light"]) .ps-field { border-color: #6FB3C4; } :root:not([data-theme="light"]) .ps-field span { color: #6FB3C4; }
  .ps-field input { width: 100%; height: 50px; border: none; outline: none; background: none; font-size: 17px; }
  .ps-note { font-size: 12.5px; color: var(--muted); margin: 8px 16px 4px; }
  #plList { flex: 1; overflow-y: auto; padding: 4px 14px 16px; }
  .pl-h { font-size: 15px; font-weight: 600; margin: 14px 2px 10px; }
  .pl-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pl-row { display: flex; align-items: center; gap: 14px; padding: 10px 2px; cursor: pointer; }
  .pl-row i { width: 44px; height: 44px; border-radius: 50%; background: var(--s1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pl-row i svg { width: 20px; height: 20px; }
  .pl-row div { flex: 1; min-width: 0; } .pl-row b { display: block; font-size: 16px; font-weight: 500; }
  .pl-row span { font-size: 13.5px; color: #3C7A89; } :root:not([data-theme="light"]) .pl-row span { color: #6FB3C4; }
  .pl-row.saved { cursor: default; } .pl-row.saved span { color: var(--muted); }
  .pl-row button { border: none; background: var(--s1); width: 32px; height: 32px; border-radius: 50%; color: var(--muted); }
  #installBar { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 64px); z-index: 1250; display: none;
    align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 18px; background: rgba(30,32,40,.95);
    border: 1px solid var(--line-2); box-shadow: 0 8px 26px rgba(0,0,0,.45); max-width: 460px; }
  #installBar.on { display: flex; animation: ibIn .3s cubic-bezier(.32,.72,0,1); }
  #installBar img { width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0; }
  .ib-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); }
  .ib-txt b { font-size: 14px; color: var(--text); }
  #ibGo { border: none; background: var(--blue); color: #fff; font-weight: 700; font-size: 13.5px; height: 34px; padding: 0 14px; border-radius: 999px; white-space: nowrap; }
  #ibX { border: none; background: none; color: var(--muted); width: 28px; height: 28px; font-size: 14px; }
  @keyframes ibIn { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  #toast { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 124px); z-index: 1400; display: none; width: max-content; max-width: calc(100% - 32px); text-align: center; color: #fff; font-size: 14.5px; font-weight: 500; padding: 13px 20px; border-radius: 999px; background: rgba(40,44,58,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line-2); box-shadow: 0 8px 26px rgba(0,0,0,.4); }

  /* ===== Wide screens: unfolded foldables, tablets, desktop ===== */
  @media (min-width: 700px) {
    body { max-width: none; }
    #panel:not(.full) .pv { touch-action: auto; overflow-y: auto; }
    #panel, #panel.full {
      left: 12px; right: auto; top: calc(env(safe-area-inset-top) + 12px); bottom: calc(env(safe-area-inset-bottom) + 12px);
      width: min(420px, 42vw); height: auto; max-height: none; border-radius: 30px;
    }
    .grab { display: none; }
    .pv { padding-top: 20px; }
    #panel .mapctl, #panel.full .mapctl { display: flex; position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 20px); top: auto; }
    .brand { left: calc(min(420px, 42vw) + 28px); }
    #routePanel { left: calc(min(420px, 42vw) + 28px); right: 16px; max-width: 620px; }
    #toast { left: calc(50% + min(420px, 42vw) / 2 + 6px); }
    #sheet { align-items: center; justify-content: center; padding: 24px; }
    #sheetBody { max-width: 560px; max-height: calc(100% - 48px); }
    #sheetBody.tall { height: calc(100% - 48px); }
    #pickWrap { height: clamp(220px, calc(100dvh - 520px), 440px); }
    #camWrap { height: clamp(260px, calc(100dvh - 420px), 520px); }
  }

  @keyframes sheetUp { from { transform: translateY(105%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #sheet.open { animation: fadeIn .18s ease; }
  #sheet.open #sheetBody { animation: sheetUp .38s cubic-bezier(.32,.72,0,1); }
  @media (prefers-reduced-motion: reduce) { #sheet.open, #sheet.open #sheetBody { animation: none; } #panel { transition: none; } }

<body>

<main>
  <div class="tab active" id="tab-map">
    <div id="map"></div>
    <div class="brand"><img class="logo-img" src="/static/logo.png?v=2" alt="glubDD" width="76" height="34"><div class="tog" role="group" aria-label="Language"><button data-lang="th" onclick="setLangTo('th')">TH</button><button data-lang="en" onclick="setLangTo('en')">EN</button></div><div class="tog" role="group" aria-label="Theme"><button data-theme-opt="light" onclick="setThemeTo('light')" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button><button data-theme-opt="dark" onclick="setThemeTo('dark')" aria-label="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div><button id="refreshBtn" onclick="hardRefresh()" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></div>
  </div>

  <div class="tab" id="tab-route">
    <div id="routePanel">
      <div class="row-in">
        <div class="trip">
          <div class="trip-row"><i class="tdot o"></i>
            <input id="origInput" data-i18n-ph="origPh" autocomplete="off" enterkeyhint="search">
            <button class="tclr" id="origClear" aria-label="Clear" onclick="clearField('orig')">✕</button></div>
          <div class="trip-sep"></div>
          <div class="trip-row"><i class="tdot d"></i>
            <input id="destInput" data-i18n-ph="destPh" autocomplete="off" enterkeyhint="search">
            <button class="tclr" id="clearBtn" aria-label="Clear" onclick="clearField('dest')">✕</button></div>
          <button id="swapBtn" aria-label="Swap" onclick="swapTrip()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        </div>
      </div>
      <div id="placeChips"></div>
      <div id="suggest"></div>
      <div id="routeHint" data-i18n="routeHint"></div>
    </div>
    <div id="routeMap"></div>
    <div id="routePrompt" aria-hidden="true"><span class="tap"><i></i><i></i><b><svg viewBox="0 0 24 34" width="27" height="38"><path d="M12 1C5.9 1 1 5.8 1 11.8c0 7.9 9.6 19.6 10 20.1.5.6 1.5.6 2 0 .4-.5 10-12.2 10-20.1C23 5.8 18.1 1 12 1z" fill="#EA4335" stroke="#B31412" stroke-width="1.2"/><circle cx="12" cy="11.8" r="4" fill="#B31412"/></svg></b></span><span class="rp-txt" data-i18n="routePrompt"></span></div>
  </div>

  <!-- Persistent bottom panel: nearby list / report detail / route options + tab bar -->
  <section id="panel">
    <div class="mapctl"><button onclick="recenter()" aria-label="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button></div>
    <div class="grab" id="panelDrag"><div class="grabber"></div></div>
    <div class="pv on" id="pv-near">
      <div class="p-head">
        <div><h2 id="nearTitle"></h2><div class="p-sub" id="locBadge"></div></div>
        <div class="rec-legend">
          <span><i style="background:var(--fresh)"></i><span data-i18n="legFresh"></span></span>
          <span><i style="background:var(--aging)"></i><span data-i18n="legAging"></span></span>
          <span><i style="background:var(--stale)"></i><span data-i18n="legStale"></span></span>
        </div>
      </div>
      <div class="seg" id="catbar"></div>
      <div id="feedScroll" class="rows"></div>
    </div>
    <div class="pv" id="pv-detail"></div>
    <div class="pv" id="pv-route"><div id="routeSummary"></div></div>
    <div id="routeNav"></div>
    <nav>
      <button data-tab="map" class="active" onclick="switchTab('map')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg><span data-i18n="tabNear"></span></button>
      <button data-tab="route" onclick="switchTab('route')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19H14a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h5.8"/></svg><span data-i18n="tabRoute"></span></button>
      <button data-tab="report" onclick="switchTab('report')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="tabReport"></span></button>
    </nav>
  </section>

  <div id="sheet">
    <div id="sheetBody">
      <div class="drag-zone" id="sheetDrag"><div class="grabber"></div>
      <div class="sh-head"><h2 data-i18n="sheetTitle"></h2><button class="sh-x" onclick="closeSheet()" aria-label="Close">✕</button></div></div>
      <!-- Stepper (type → location → photo): one step open at a time; finished steps collapse to a ✓ summary and can be reopened. -->
      <div class="steps">
        <section class="step" data-step="type">
          <button class="step-h" onclick="goStep(0)"><span class="step-n">1</span><span class="step-t" data-i18n="st2"></span><span class="step-s" id="sum2"></span></button>
          <div class="step-b pad">
            <div class="seg" id="catSeg"></div>
            <div class="chips" id="typeChips"></div>
          </div>
        </section>
        <section class="step" data-step="where">
          <button class="step-h" onclick="goStep(1)"><span class="step-n">2</span><span class="step-t" data-i18n="st3"></span><span class="step-s" id="sum3"></span></button>
          <div class="step-b">
            <div id="pickWrap">
              <div id="pickMap"></div>
              <div id="crosshair"><svg viewBox="0 0 24 34" width="27" height="38"><path d="M12 1C5.9 1 1 5.8 1 11.8c0 7.9 9.6 19.6 10 20.1.5.6 1.5.6 2 0 .4-.5 10-12.2 10-20.1C23 5.8 18.1 1 12 1z" fill="#EA4335" stroke="#B31412" stroke-width="1.2"/><circle cx="12" cy="11.8" r="4" fill="#B31412"/></svg></div>
              <div id="pickHint" data-i18n="pickHint"></div>
              <div id="pickArrow"><svg viewBox="0 0 120 120"><defs><radialGradient id="gdBeam" cx="60" cy="60" r="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4285F4" stop-opacity=".75"/><stop offset="1" stop-color="#4285F4" stop-opacity="0"/></radialGradient></defs><path d="M60 60 L31 9.8 A58 58 0 0 1 89 9.8 Z" fill="url(#gdBeam)"/><circle cx="60" cy="60" r="8" fill="#4285F4" stroke="#fff" stroke-width="3"/></svg></div>
              <button id="pickLocate" onclick="pickRecenter()" aria-label="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
            </div>
            <div class="pad">
              <div class="side-row" id="sideRow"><span class="side-q" data-i18n="sideQ"></span>
                <div class="seg side-seg"><button id="sideSame" onclick="setSide('same')" data-i18n="sideSame"></button><button id="sideOpp" onclick="setSide('opp')" data-i18n="sideOpp"></button></div></div>
              <div class="side-row" id="dirRow"><span class="side-q" id="dirTxt"></span>
                <button class="btn-dark dir-btn" onclick="startCompass()" data-i18n="setDir"></button></div>
              <input id="labelInput" data-i18n-ph="placePh"></div>
          </div>
        </section>
        <section class="step" data-step="photo">
          <button class="step-h" onclick="goStep(2)"><span class="step-n">3</span><span class="step-t" data-i18n="st1"></span><span class="step-s" id="sum1"></span></button>
          <div class="step-b">
            <div id="camWrap">
              <video id="camVideo" playsinline muted autoplay></video>
              <img id="camShot" alt="">
              <div id="camMsg"></div>
              <div id="camCheck"></div>
              <button id="shutter" onclick="capturePhoto()" aria-label="Take photo"></button>
              <button id="retake" onclick="startCamera()" data-i18n="retake"></button>
              <div class="cam-note" data-i18n="passengerNote"></div>
            </div>
          </div>
        </section>
      </div>
      <div class="sheet-actions">
        <button class="cancel" id="backBtn" onclick="stepBack()"></button>
        <button class="submit" id="nextBtn" onclick="stepNext()"></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="placeSheet" onclick="if (event.target === this) closePlaceSheet()">
    <div class="ps-body">
      <div class="ps-head"><button class="ibtn" onclick="closePlaceSheet()" aria-label="Back">←</button><h2 data-i18n="savePlace"></h2><span></span></div>
      <div class="ps-search"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></i><input id="plSearch" autocomplete="off" enterkeyhint="search" data-i18n-ph="plSearchPh" oninput="plSearchInput()"><div id="plSug"></div></div>
      <div id="placeWrap"><div id="placeMap"></div><div class="ps-pin"><svg viewBox="0 0 24 34" width="27" height="38"><path d="M12 1C5.9 1 1 5.8 1 11.8c0 7.9 9.6 19.6 10 20.1.5.6 1.5.6 2 0 .4-.5 10-12.2 10-20.1C23 5.8 18.1 1 12 1z" fill="#EA4335" stroke="#B31412" stroke-width="1.2"/><circle cx="12" cy="11.8" r="4" fill="#B31412"/></svg></div><div class="ps-hint" data-i18n="pickHint"></div></div>
      <label class="ps-field"><span data-i18n="placeNameL"></span><input id="plName" autocomplete="off" enterkeyhint="done" oninput="renderPlaceSuggest()" onkeydown="if (event.key === 'Enter') savePlace()"></label>
      <div class="ps-note" data-i18n="placeLocal"></div>
      <div id="plList"></div>
    </div>
  </div>
  <div id="installBar" role="status"><img src="/static/icon-180.png?v=2" alt=""><div class="ib-txt"><b data-i18n="installT"></b><span id="ibHow"></span></div>
    <button id="ibGo" data-i18n="installGo"></button><button id="ibX" aria-label="Close">✕</button></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  if (GMAPS_KEY) {
    let l = "th"; try { l = localStorage.getItem("daan-lang") || "th"; } catch (e) {}
    document.write('<script src="https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GMAPS_KEY) +
      '&language=' + l + '&region=TH&v=weekly"><\/script>' +
      '<script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js"><\/script>');
  }
</script>
<script>

  document.querySelectorAll("[data-theme-opt]").forEach(b => { b.classList.toggle("on", b.dataset.themeOpt === t); b.setAttribute("aria-pressed", b.dataset.themeOpt === t); });
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t === "light" ? "#EEF0F3" : "#111214");
  baseMaps.forEach(gl => { if (gl.isStyleLoaded()) { setMapLabels(gl); tuneStyle(gl); } });
  gLayers.forEach(g => { g.lmap.removeLayer(g.layer); g.layer = googleLayer().addTo(g.lmap); g.layer.bringToBack(); });
}
function setThemeTo(t) { if ((isLight() ? "light" : "dark") !== t) toggleTheme(); }
function setLangTo(l) { if (lang !== l) toggleLang(); }
function toggleTheme() {
  const t = isLight() ? "dark" : "light";
  try { localStorage.setItem("gd-theme", t); } catch (e) {}
  applyTheme(t); track("theme", { theme: t });
}
function toggleLang() {
  lang = lang === "th" ? "en" : "th";
  track("lang", { lang });
  try { localStorage.setItem("daan-lang", lang); } catch (e) {}
  applyLang();
  renderMap();
  renderFeed();
  renderRouteCps();
  if (routeData.length) { drawRoutes(); renderRouteSummary(); } else renderRouteEmpty();
  if (panelView === "detail" && selectedId) openDetail(selectedId);
}

function tuneStyle(gl) {
  for (const [id, color] of Object.entries(isLight() ? PALETTE_LIGHT : PALETTE)) {
    const l = gl.getLayer(id); if (!l) continue;
    const prop = l.type === "background" ? "background-color" : l.type === "fill" ? "fill-color" : "line-color";
    gl.setPaintProperty(id, prop, color);
    if (l.type === "fill") gl.setPaintProperty(id, "fill-opacity", 1);
  }
  ["highway_minor", "highway_major_inner", "highway_motorway_inner"].forEach(id => gl.getLayer(id) && gl.setPaintProperty(id, "line-opacity", 1));
  setTimeout(() => { gl._gdScaled = true; }, 0);
  const P = isLight() ? PALETTE_LIGHT : PALETTE;
  // Parks (leisure=park) aren't drawn by the base style; add them like Google Maps does.
  if (!gl.getLayer("gd-park")) {
    try { gl.addLayer({ id: "gd-park", type: "fill", source: "openmaptiles", "source-layer": "landcover",
      filter: ["in", ["get", "class"], ["literal", ["grass", "wood", "farmland"]]],
      paint: { "fill-color": P.landuse_park } }, gl.getLayer("water") ? "water" : undefined); } catch (e) { console.warn(e); }
  } else gl.setPaintProperty("gd-park", "fill-color", P.landuse_park);
  if (gl.getLayer("building")) gl.setPaintProperty("building", "fill-outline-color", isLight() ? "#D2D6DE" : P.building);
  ["railway_transit_dashline", "railway_minor_dashline", "railway_dashline"].forEach(id => gl.getLayer(id) && gl.setPaintProperty(id, "line-color", P.background));
  gl.getStyle().layers.filter(l => l.type === "symbol").forEach(l => {
    if (!gl.getLayoutProperty(l.id, "text-field")) return;
    const major = l.id.startsWith("place_city") || l.id === "place_town";
    const L = isLight();
    gl.setPaintProperty(l.id, "text-color", L ? (major ? "#202124" : l.id.startsWith("highway") ? "#3C4043" : "#3C4043")
                                             : (major ? "#FFFFFF" : l.id.startsWith("highway") ? "#E8EAED" : "#DADCE0"));
    gl.setPaintProperty(l.id, "text-halo-color", L ? "#FFFFFF" : "#1B2439");
    gl.setPaintProperty(l.id, "text-halo-blur", 0);
    if (!gl._gdScaled) scaleTextSize(gl, l.id, 1.15);
    gl.setPaintProperty(l.id, "text-halo-width", 1.2);
  });
}
// Labels ~15% larger (OpenFreeMap defaults are small/thin next to Google Maps).
function scaleTextSize(gl, id, k) {
  const v = gl.getLayoutProperty(id, "text-size");
  let out = null;
  if (typeof v === "number") out = v * k;
  else if (v && Array.isArray(v.stops)) out = { ...v, stops: v.stops.map(([z, n]) => [z, n * k]) };
  else if (Array.isArray(v) && v[0] === "interpolate") out = v.map((x, i) => (i > 3 && i % 2 === 0 && typeof x === "number") ? x * k : x);
  if (out != null) { try { gl.setLayoutProperty(id, "text-size", out); } catch (e) {} }
}
function setMapLabels(gl) {
  if (!gl || !gl.isStyleLoaded()) return;
  const field = lang === "en"
    ? ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"]]
    : ["coalesce", ["get", "name:th"], ["get", "name"]];
  gl.getStyle().layers.filter(l => l.type === "symbol").forEach(l => {
    if (gl.getLayoutProperty(l.id, "text-field")) gl.setLayoutProperty(l.id, "text-field", field);
  });
}
function addBasemap(lmap) {
  if (useGoogle()) {
    const layer = googleLayer().addTo(lmap);
    gLayers.push({ lmap, layer });
    return layer;
  }
  const layer = L.maplibreGL({ style: STYLE_URL, attribution: MAP_ATTR }).addTo(lmap);
  const gl = layer.getMaplibreMap();
  baseMaps.push(gl);
  gl.on("styleimagemissing", e => { // quiet missing pattern sprites
    if (!gl.hasImage(e.id)) gl.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
  });
  gl.on("load", () => { setMapLabels(gl); tuneStyle(gl); });
  return layer;
}

function locate() {
  if (!navigator.geolocation) { userLoc = DEFAULT_LOC; onLocated(false); return; }
  navigator.geolocation.getCurrentPosition(
    p => { userLoc = [p.coords.latitude, p.coords.longitude]; onLocated(true); },
    () => { userLoc = DEFAULT_LOC; onLocated(false); },
    { timeout: 6000 }
  );
}

function onLocated(real) {

  if (!focusedShared) map.setView(userLoc, 15);
  routeMap.setView(userLoc, 14);

}

function haversineM(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dp = (b[0]-a[0])*toR, dl = (b[1]-a[1])*toR;
  const h = Math.sin(dp/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function agoText(min) {
  if (min < 1) return t("justNow");
  if (min < 60) return t("minAgo", min);
  const h = Math.floor(min/60), m = min%60;
  return m ? t("hMinAgo", h, m) : t("hAgo", h);
}
function distText(m) { return m < 1000 ? `${Math.round(m)} ${t("m")}` : `${(m/1000).toFixed(1)} ${t("km")}`; }

// Map pins: pill style shows the CATEGORY (shield = checkpoint; yellow border + warning = incident),
// the dot shows RECENCY (red <1h, orange 1–3h, grey >3h). Same encoding as the legend.
function pinColor(cp) {
  return cp.age_minutes <= 60 ? "var(--fresh)" : cp.age_minutes <= 180 ? "var(--aging)" : "var(--stale)";
}
const COMPACT_BELOW_ZOOM = 13; // below this, pins shrink to dots so they don't pile up
function makeMarker(cp, big = false, onMap = map) {
  const inc = catOf(cp) === "incident";
  if (onMap.getZoom() < COMPACT_BELOW_ZOOM && !big && cp.id !== selectedId) {
    const icon = L.divIcon({ className: "mk-wrap", iconSize: [0, 0],
      html: `<div class="mk dot ${inc ? "inc" : "cp"} ${cp.age_minutes > 180 ? "stale" : ""}"><i style="background:${pinColor(cp)}"></i></div>` });
    return L.marker([cp.lat, cp.lng], { icon, zIndexOffset: cp.age_minutes <= 60 ? 500 : 0 }).on("click", () => openDetail(cp.id));
  }
  const cls = ["mk", inc ? "inc" : "cp", cp.age_minutes > 180 ? "stale" : "", big || cp.id === selectedId ? "sel" : ""].join(" ");
  const icon = L.divIcon({ className: "mk-wrap", iconSize: [0, 0],
    html: `<div class="${cls}"><span class="ic">${typeIcon(cp.type)}</span><i style="background:${pinColor(cp)}"></i>${cp.heading != null ? `<span class="hd" style="transform:rotate(${cp.heading}deg)">${ARROW_SVG}</span>` : ""}</div>` });
  return L.marker([cp.lat, cp.lng], { icon, zIndexOffset: big || cp.id === selectedId ? 1000 : (cp.age_minutes <= 60 ? 500 : 0) })
    .on("click", () => openDetail(cp.id));
}
function styleFor(cp) {
  if (cp.age_minutes <= 60) return { color: "#fff", fillColor: "#FF453A", fillOpacity: 1, radius: 11, weight: 2 };
  if (cp.age_minutes <= 180) return { color: "#fff", fillColor: "#FF9F0A", fillOpacity: .9, radius: 9, weight: 2 };
  return { color: "#fff", fillColor: "#8E8E93", fillOpacity: .7, radius: 7, weight: 2 };
}

// Per-report share + open in Google/Apple Maps.
function gmapsUrl(cp) { return `https://www.google.com/maps/search/?api=1&query=${cp.lat.toFixed(6)},${cp.lng.toFixed(6)}`; }
function amapsUrl(cp) { return `https://maps.apple.com/?ll=${cp.lat.toFixed(6)},${cp.lng.toFixed(6)}&q=${encodeURIComponent(typeName(cp.type))}`; }
function linkRow(cp, cls) {
  return `<div class="${cls} links"><button onclick="shareReport(${cp.id})">${t("share")}</button>
    <a href="${gmapsUrl(cp)}" target="_blank" rel="noopener">${ICON_GO}${t("openG")}</a>
    <a href="${amapsUrl(cp)}" target="_blank" rel="noopener">${t("openA")}</a></div>`;
}
async function shareReport(id) {
  track("share");
  const cp = checkpoints.find(c => c.id === id); if (!cp) return;
  const appUrl = `${location.origin}/?r=${cp.id}`;
  const text = `${typeName(cp.type)} · ${labelName(cp.label)} (${agoText(cp.age_minutes)})\nGoogle Maps: ${gmapsUrl(cp)}`;
  try {
    if (navigator.share) { await navigator.share({ title: t("shareTitle"), text, url: appUrl }); return; }
    await navigator.clipboard.writeText(`${text}\n${appUrl}`);
    toast(t("copied"));
  } catch (e) { if (e && e.name !== "AbortError") toast(t("shareErr")); }
}
// Opening a shared link (/?r=<id>) focuses that report on the map.
let sharedHandled = false, focusedShared = false, selectedId = null;
function openShared() {
  if (sharedHandled) return; sharedHandled = true;
  const id = +new URLSearchParams(location.search).get("r"); if (!id) return;
  history.replaceState(null, "", location.pathname);
  const cp = checkpoints.find(c => c.id === id);
  if (!cp) return toast(t("sharedGone"));
  switchTab("map");
  if (!catShown(cp)) setCat("all");
  focusedShared = true;
  map.setView([cp.lat, cp.lng], 16);
  openDetail(id);
}

function catTag(cp) {
  const inc = catOf(cp) === "incident";
  return `<span class="cat-tag ${inc ? "inc" : "cp"}">${t(inc ? "tagIncident" : "tagCheckpoint")}</span>`;
}

function renderMap() {
  mapLayer.clearLayers();
  checkpoints.filter(catShown).forEach(cp => makeMarker(cp).addTo(mapLayer));
}

function ptSegDistM(p, a, b) {
  const toR = Math.PI/180, latR = p[0]*toR;

  const bx = (b[1]-a[1])*mPerLng, by = (b[0]-a[0])*mPerLat;
  const len2 = bx*bx + by*by;
  let tt = len2 ? (px*bx + py*by)/len2 : 0;
  tt = Math.max(0, Math.min(1, tt));
  const dx = px - tt*bx, dy = py - tt*by;

    const r = ptSegDistM([cp.lat, cp.lng], coords[i], coords[i+1]);

/* ---------- nav hand-off: route points ("shape waypoints") ----------

   at all when tollway/motorway data is missing. They show as stops in the nav apps. */

   Anti-spam: live camera only (no file upload), reporter's live GPS must be near the pin,
   server rate-limits and (if configured) has Claude check the photo shows a checkpoint.
   The photo is only used for that check and is never stored. */
let camStream = null, photoData = null, reportPos = null, photoOk = false, photoProbs = undefined;

/* On-device photo check: MobileCLIP-S0 (Apple, open weights) via transformers.js, zero server cost.
   The model compares the photo with short text descriptions grouped by report kind; the text side was computed offline and
   ships as /static/clip_labels.json, so only the ~23 MB image model downloads (once, then cached).
   Pass rule: the photo must look like a road event at all (1 - P(neg) >= 0.5) AND the selected
   type must be plausible (P(type group) >= 0.15). On 47 sample photos: 34/36 real reports passed,
   all food/room/selfie photos were rejected. */
const CLIP_MODEL = "Xenova/mobileclip_s0";
const CLIP_EVENT_MIN = 0.5, CLIP_TYPE_MIN = 0.15, CLIP_AUTODETECT = 0.6;
let clipReady = null;
function loadClip() {
  if (!clipReady) clipReady = (async () => {
    const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2");
    T.env.allowLocalModels = false;
    const [processor, model, labels] = await Promise.all([
      T.AutoProcessor.from_pretrained(CLIP_MODEL),
      T.CLIPVisionModelWithProjection.from_pretrained(CLIP_MODEL, { dtype: "fp16", device: "wasm" }),
      fetch("/static/clip_labels.json").then(r => r.json()),
    ]);
    return { T, processor, model, labels };
  })().catch(e => { clipReady = null; throw e; });
  return clipReady;
}
// Returns {group: probability} over the label groups (checkpoint, accident, roadwork, flood,
// blocked, neg), or null if the model can't run.
async function photoScores(canvas) {
  try {
    const { T, processor, model, labels } = await loadClip();
    const img = await T.RawImage.fromCanvas(canvas);
    const { image_embeds } = await model(await processor(img));
    const v = image_embeds.normalize().tolist()[0];
    const logits = labels.embeds.map(e => 100 * e.reduce((s, x, i) => s + x * v[i], 0));
    const m = Math.max(...logits), ex = logits.map(l => Math.exp(l - m)), z = ex.reduce((a, b) => a + b);
    const out = {};
    labels.groups.forEach((g, i) => { out[g] = (out[g] || 0) + ex[i] / z; });
    return out;
  } catch (e) {
    console.warn("photo check unavailable", e);
    return null;
  }
}

async function capturePhoto() {

  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);

/* Drag the grabber/title down to close; tap the dimmed backdrop to close. Drags that start inside

(function sheetDrag() {
  const body = $("sheetBody"), zone = $("sheetDrag");
  let y0 = null, t0 = 0, dy = 0;
  zone.addEventListener("pointerdown", e => {
    if (e.target.closest(".sh-x")) return;
    y0 = e.clientY; t0 = performance.now(); dy = 0;

  });
  zone.addEventListener("pointermove", e => {
    if (y0 === null) return;

  });
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, performance.now() - t0); // px per ms
    y0 = null;
    body.classList.remove("dragging"); body.classList.add("snap");
    const need = mapStepOpen() ? 0.4 : 0.25;
    if (dy > body.offsetHeight * need || (!mapStepOpen() && v > 0.6)) {
      body.style.transform = "translateY(100%)";
      setTimeout(() => { closeSheet(); body.classList.remove("snap"); body.style.transform = ""; }, 230);
    } else {
      body.style.transform = "";
    }
  };

  el.addEventListener("focus", () => {
    hideRoutePrompt();
    if (activeField !== f) suggestions = [];
    activeField = f; renderSuggest(el.value.trim());
  });
  el.addEventListener("blur", () => setTimeout(() => { if (!document.activeElement || !document.activeElement.closest(".trip")) { closeSuggest(); if (activeField === "orig" && !tripOrig) setTimeout(() => { activeField = "dest"; }, 300); } }, 150));
});

/* ---------- Drag the sheet from its content, not just the grabber ----------
   When the content is scrolled to the top, a downward drag moves the sheet instead of scrolling
   (bottom panel shrinks; report sheet closes). While the panel isn't full height, an upward drag
   expands it. Drags that start on maps, the camera, inputs or segmented controls, sideways swipes,
   and drags in content that's scrolled down keep their normal behaviour. */
function contentDrag(el, o) {
  let sx = 0, sy = 0, t0 = 0, mode = null;
  el.addEventListener("touchstart", e => {
    mode = null;
    if (e.touches.length !== 1 || !o.enabled() || e.target.closest(".leaflet-container, #camWrap, input, textarea, .seg")) { mode = "skip"; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = performance.now();
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (mode === "skip") return;
    if (e.touches.length > 1) {                       // pinch: never a sheet drag
      if (mode === "drag") o.end(0, 0);
      mode = "skip"; return;
    }
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (mode === null) {
      const dx = x - sx, dy = y - sy;
      if (dx === 0 && dy === 0) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.5) { mode = "skip"; return; }
      const locked = o.locked && o.locked(); // content can't scroll in this state: every vertical drag moves the sheet
      if (locked || (dy > 0 && el.scrollTop <= 0) || (dy < 0 && o.allowUp && o.allowUp())) mode = "drag";
      else { mode = "skip"; return; }
      t0 = performance.now(); o.begin();
    }
    e.preventDefault();
    o.move(y - sy);
  }, { passive: false });
  const finish = e => {
    if (mode === "drag") {
      const dy = e.changedTouches[0].clientY - sy;
      o.end(dy, dy / Math.max(1, performance.now() - t0));
    }
    mode = null;
  };
  el.addEventListener("touchend", finish);
  el.addEventListener("touchcancel", finish);
}

// Bottom panel: same height snapping as the grabber.
let panelH0 = 0;
const panelDragOpts = {
  enabled: () => !isWide(),
  locked: () => panelView === "detail" ? !$("panel").classList.contains("dt-scroll") : panelState() !== "full",
  allowUp: () => panelState() !== "full" && !(panelView === "route" && !routeData.length),
  begin: () => { panelH0 = $("panel").offsetHeight; $("panel").classList.add("dragging"); },
  move: dy => { $("panel").style.height = Math.max(150, Math.min(window.innerHeight - 80, panelH0 - dy)) + "px"; },
  end: (dy, v) => {
    const p = $("panel"); p.classList.remove("dragging"); p.style.height = "";
    const st = panelState();
    if (panelView === "detail") { if (dy > 40 || v > 0.5) closeDetail(); else setPanel("detail"); return; }
    if (dy < -40 || v < -0.5) setPanel("full");
    else if (dy > 40 || v > 0.5) { if (st === "collapsed" && panelView === "route" && routeData.length) closeRoute(); else setPanel("collapsed"); }
  },
};
document.querySelectorAll("#panel .pv").forEach(el => contentDrag(el, panelDragOpts));

// Report sheet: drag down from the top of its content to close.
// While the location map or camera is open the sheet never closes from a content drag
// (pinch-zooming the map kept closing it); only the grabber/✕/Back close it then.
const mapStepOpen = () => STEPS[step] === "where" || STEPS[step] === "photo";
contentDrag(document.querySelector("#sheetBody .steps"), {
  enabled: () => !mapStepOpen(),
  begin: () => { const b = $("sheetBody"); b.classList.add("dragging"); b.classList.remove("snap"); },
  move: dy => { $("sheetBody").style.transform = `translateY(${Math.max(0, dy)}px)`; },
  end: (dy, v) => {
    const b = $("sheetBody");
    b.classList.remove("dragging"); b.classList.add("snap");
    if (dy > b.offsetHeight * 0.25 || v > 0.6) {
      b.style.transform = "translateY(100%)";
      setTimeout(() => { closeSheet(); b.classList.remove("snap"); b.style.transform = ""; }, 230);
    } else b.style.transform = "";
  },
});

/* ---------- installability, analytics ping, install snackbar ---------- */
const IS_STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// Analytics: one visit ping (platform, language, traffic source, first visit) + feature events.
function track(kind, meta) {
  fetch("/api/event", { method: "POST", headers: apiHeaders(), keepalive: true,
    body: JSON.stringify({ kind, meta: meta || null, standalone: IS_STANDALONE }) }).catch(() => {});
}
(() => {
  const ua = navigator.userAgent, q = new URLSearchParams(location.search);
  const platform = /iPhone|iPad|iPod/.test(ua) ? "ios" : /Android/.test(ua) ? "android" : "desktop";
  let src = q.get("utm_source") || (q.get("r") ? "shared_link" : null);
  if (!src && document.referrer) { try { const h = new URL(document.referrer).hostname; if (h && h !== location.hostname) src = h.replace(/^www\./, ""); } catch (e) {} }
  let isNew = false;
  try { if (!localStorage.getItem("gd-seen")) { isNew = true; localStorage.setItem("gd-seen", Date.now()); } } catch (e) {}
  fetch("/api/visit", { method: "POST", headers: apiHeaders(), keepalive: true,
    body: JSON.stringify({ standalone: IS_STANDALONE, platform, lang, src: src || "direct", new: isNew,
                           theme: document.documentElement.dataset.theme || "dark" }) }).catch(() => {});
})();
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if ($("installBar").classList.contains("on")) renderInstall(); });
window.addEventListener("appinstalled", () => { track("installed"); hideInstall(); });
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let installT = null;
function renderInstall() {
  $("ibHow").textContent = installEvt ? t("installAndroid") : IS_IOS ? t("installIOS") : t("installOther");
  $("ibGo").textContent = installEvt ? t("installGo") : t("installGot");
}
function hideInstall() { $("installBar").classList.remove("on"); clearTimeout(installT); }
function showInstall() {
  if (IS_STANDALONE) return;            // opened from the home-screen shortcut: never show
  renderInstall();
  $("installBar").classList.add("on");
  track("install_shown", { native: !!installEvt });
  installT = setTimeout(hideInstall, IS_IOS ? 9000 : 7000);
}
$("ibX").onclick = hideInstall;
$("ibGo").onclick = async () => {
  track("install_click", { native: !!installEvt });
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; }
  hideInstall();
};
setTimeout(showInstall, 1500);           // every browser visit, after the map has appeared

(() => { const u = new URL(location.href); if (u.searchParams.has("_")) { u.searchParams.delete("_"); history.replaceState(null, "", u.pathname + u.search + u.hash); } })();
initMaps();
applyTheme(document.documentElement.dataset.theme || "light");
applyLang();
locate();
loadCheckpoints();
setInterval(loadCheckpoints, 60000);
</script>
</body>
