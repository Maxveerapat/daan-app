<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ด่าน — แจ้งเตือนด่านตรวจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* ============ Design system — modelled on JodNai (jodnai.com) ============
     Navy map; one persistent bottom panel (solid near-black, big radius, inset) that holds the
     list, the detail view and the tab bar; solid dark surfaces with hairline borders; blue solid
     primary CTA, outlined secondary; green for good values, red/orange for warnings. Glass only on
     things that float over the map (tab bar, map controls, top pills). Font: Google Sans (TH+EN). */
  :root {
    --bg: #111214;
    --sheet: #1B1C1E;
    --s1: #232528;
    --s2: #2C2E32;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.12);
    --text: #F2F2F3;
    --muted: #9B9EA4;
    --faint: #6E7177;
    --blue: #2D5BFF;
    --blue-t: #7EA3FF;
    --green: #5CCB8A;
    --green-bg: #1C3328;
    --red: #FF6B5A;
    --amber: #FFB340;
    --yellow: #FFD23F;
    --fresh: #FF5A4E;
    --aging: #FFB340;
    --stale: #7A7D84;
    --map-bg: #2B3150;
    --glass: rgba(30,32,40,.62);
    --glass-blue: rgba(52,70,140,.55);
    --panel-gap: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont, Roboto, "Noto Sans Thai", sans-serif;
    background: var(--bg); color: var(--text);
    position: relative; max-width: 480px; margin: 0 auto; height: 100dvh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, .row-t, .row-s, .dt-sub, .note, #camCheck, #toast { text-wrap: balance; }
  .nw { white-space: nowrap; }

  main { position: absolute; inset: 0; overflow: hidden; }
  .tab { position: absolute; inset: 0; display: none; }
  .tab.active { display: block; }
  #map, #routeMap { position: absolute; inset: 0; }
  #pickMap { position: absolute; inset: 0; }
  .leaflet-container { background: var(--map-bg); font-family: inherit; }
  .leaflet-control-attribution { background: rgba(20,22,35,.5) !important; color: #7d84a3 !important; font-size: 9px !important; padding: 0 6px !important; }
  .leaflet-control-attribution a { color: #9aa2c4 !important; }

  /* ---- floating over the map ---- */
  .brand {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; z-index: 900;
    display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line-2); font-weight: 700; font-size: 17px;
  }
  .brand i { width: 30px; height: 30px; border-radius: 9px; background: var(--blue); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 15px; }
  .mapctl {
    position: absolute; right: 2px; bottom: calc(100% + 12px); z-index: 2; display: flex; flex-direction: column;
    border-radius: 999px; overflow: hidden; background: var(--glass-blue);
    -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid rgba(160,180,255,.22); box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  #panel.full .mapctl { display: none; }
  .mapctl button { width: 52px; height: 52px; border: none; background: none; display: flex; align-items: center; justify-content: center; color: #fff; }
  .mapctl button + button { border-top: 1px solid rgba(255,255,255,.14); }
  .mapctl svg { width: 22px; height: 22px; }

  /* ---- legend (inside the panel) ---- */
  .rec-legend { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; font-size: 12px; color: #C9CCD3; }
  .rec-legend > span { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .rec-legend i { width: 9px; height: 9px; border-radius: 50%; }
  .leg-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: -4px 0 10px; font-size: 12px; }
  .seg-ic { display: inline-flex; width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
  .seg-ic svg { width: 100%; height: 100%; }
  .seg-ic.cp { color: #FF8A7E; } .seg-ic.inc { color: var(--yellow); }
  .brand #langBtn { margin-left: 4px; height: 30px; padding: 0 11px; border-radius: 999px; border: none; background: rgba(255,255,255,.12); font-size: 12.5px; font-weight: 700; }
  .lg-i { display: flex; align-items: center; gap: 5px; color: #D7DAE4; }
  .lg-i i { width: 9px; height: 9px; border-radius: 50%; }
  .mk-s { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 999px; background: #1E1F23; font-weight: 700; font-size: 12px; border: 1.5px solid rgba(255,255,255,.16); }
  .mk-s .ic, .mk .ic { display: inline-flex; width: 15px; height: 15px; }
  .mk-s .ic svg, .mk .ic svg { width: 100%; height: 100%; }
  .mk-s.cp .ic, .mk.cp .ic { color: #FF8A7E; }
  .mk-s.inc, .mk.inc { border-color: var(--yellow); }
  .mk-s.inc .ic, .mk.inc .ic { color: var(--yellow); }

  /* ---- map pins: dark pill labels (JodNai style) ---- */
  .mk-wrap { background: none; border: none; }
  .mk {
    position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px; white-space: nowrap;
    background: #1E1F23; color: #fff; font-size: 13px; font-weight: 700; padding: 6px 11px 6px 8px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.14); box-shadow: 0 3px 10px rgba(0,0,0,.45); line-height: 1;
  }
  .mk i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .mk.inc { background: #2A2614; }
  .mk.stale { opacity: .6; }
  .mk.big, .mk.sel { border-color: #fff; transform: translate(-50%, -50%) scale(1.08); z-index: 2; }
  .mk.ghost { opacity: .45; }
  .mk.dot { padding: 0; width: 18px; height: 18px; justify-content: center; border-width: 2px; }
  .mk.dot i { width: 8px; height: 8px; }
  .mk.dot.inc { border-radius: 4px; transform: translate(-50%, -50%) rotate(45deg); }

  /* ---- persistent bottom panel ---- */
  #panel {
    position: absolute; left: var(--panel-gap); right: var(--panel-gap); bottom: calc(env(safe-area-inset-bottom) + var(--panel-gap)); z-index: 1000;
    height: var(--collapsed, 210px); display: flex; flex-direction: column;
    background: var(--sheet); border-radius: 34px; border: 1px solid var(--line);
    box-shadow: 0 -6px 30px rgba(0,0,0,.35); transition: height .32s cubic-bezier(.32,.72,0,1);
  }
  #panel.full { height: calc(100% - env(safe-area-inset-top) - 76px); }
  #panel.fitdetail { height: var(--detail-h, 70%); }
  #panel.fitdetail .pv { touch-action: none; overflow: hidden; }
  #panel.fitdetail.dt-scroll .pv { touch-action: pan-y; overflow-y: auto; }

  /* Not full: content drags the panel (no scrolling, no browser overscroll). Full: content scrolls. */
  #panel .pv { overscroll-behavior: contain; }
  #panel:not(.full) .pv { touch-action: none; overflow: hidden; }
  html, body { overscroll-behavior: none; }
  #panel.dragging { transition: none; }
  #panel.tint-cp { background: radial-gradient(120% 60% at 0% 0%, rgba(255,90,78,.16), transparent 60%), var(--sheet); }
  #panel.tint-inc { background: radial-gradient(120% 60% at 0% 0%, rgba(255,200,60,.14), transparent 60%), var(--sheet); }
  .grab { padding: 8px 0 2px; touch-action: none; cursor: grab; flex-shrink: 0; }
  .grabber { width: 40px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); margin: 0 auto; }
  .pv { position: relative; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px 12px; display: none; }
  .pv.on { display: block; }

  .p-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
  .p-head > div:first-child { min-width: 0; }
  .p-head h2 { font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
  .p-sub { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtns { display: flex; gap: 8px; flex-shrink: 0; }
  .ibtn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--s1); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .ibtn svg { width: 18px; height: 18px; }

  /* segmented control */
  .seg { display: flex; padding: 4px; border-radius: 999px; background: var(--s1); gap: 2px; }
  .seg button { flex: 1; border: none; background: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 7px 6px; border-radius: 999px; white-space: nowrap; }
  .seg button.on { background: var(--s2); color: var(--text); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.35); }

  /* list rows */
  .rows { margin: 8px -18px 0; }
  .row { display: flex; align-items: center; gap: 14px; padding: 11px 18px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:active { background: rgba(255,255,255,.03); }
  .tile {
    width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--s1); border: 1px solid var(--line);
  }
  .tile svg { width: 22px; height: 22px; }
  .tile.cp { color: #FF8A7E; } .tile.inc { color: var(--yellow); }

  .tile.big.cp { background: linear-gradient(160deg, #3A1A18, #24171A); border-color: rgba(255,120,110,.25); }
  .tile.big.inc { background: linear-gradient(160deg, #3A3215, #24211A); border-color: rgba(255,210,63,.25); }
  .row-main { flex: 1; min-width: 0; }
  .row-t { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-s { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-s .live { color: var(--red); font-weight: 600; }
  .row-v .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .row-s .cat-tag { font-size: 11.5px; padding: 2px 7px; margin-right: 5px; }
  .row-v { font-size: 16px; font-weight: 500; text-align: right; flex-shrink: 0; }
  .row-v small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .empty { text-align: center; color: var(--muted); font-size: 15px; padding: 34px 10px; }
  .more { display: flex; justify-content: space-between; padding: 14px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; cursor: pointer; }

  /* detail view */
  .dt-head { display: flex; gap: 12px; align-items: center; margin: 0 0 12px; }
  .dt-head .main { flex: 1; min-width: 0; }
  .dt-head h2 { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .dt-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .dt-head .ibtn { width: 38px; height: 38px; font-size: 14px; }
  .tile.big { width: 46px; height: 46px; border-radius: 14px; }
  .tile.big svg { width: 22px; height: 22px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 18px; }
  .chip-link {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 13px 16px; border-radius: 999px;
    background: var(--s1); border: none; font-size: 15px; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden;
  }
  .chip-link::after { content: "›"; color: var(--muted); font-size: 20px; line-height: 1; }
  h3.sec { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
  .infobox { background: var(--green-bg); border-radius: 16px; padding: 8px 14px; color: var(--green); font-size: 14px; }
  .infobox .ln { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .infobox .ln span:first-child { color: #9FD9B8; }
  .table { background: var(--s1); border-radius: 18px; overflow: hidden; margin-top: 10px; }
  .table .tr { display: flex; justify-content: space-between; gap: 10px; padding: 13px 16px; font-size: 15px; }
  .table .tr + .tr { border-top: 1px solid var(--line); }
  .table .tr span:first-child { color: var(--muted); }
  .vote2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-dark { height: 40px; border-radius: 999px; border: none; background: var(--s1); font-size: 14px; font-weight: 600; }
  .btn-dark:active { background: var(--s2); }
  .cta {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border-radius: 999px; border: none;
    background: var(--blue); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; margin-top: 14px;
  }
  .cta svg { width: 18px; height: 18px; }
  .btn-outline {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border-radius: 999px;
    border: 1px solid var(--line-2); background: none; color: var(--text); font-size: 16px; font-weight: 500; text-decoration: none; margin-top: 8px;
  }
  .btn-outline svg { width: 19px; height: 19px; }
  .foot { display: flex; align-items: center; margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .foot > * { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: none; border: none; color: var(--muted); font-size: 14px; text-decoration: none; padding: 8px; }
  .foot > * + * { border-left: 1px solid var(--line-2); }
  .foot svg { width: 16px; height: 16px; }

  /* tab bar inside the panel (glass) */
  #panel nav {
    flex-shrink: 0; margin: 2px 8px 8px; display: flex; padding: 3px; border-radius: 999px;
    background: rgba(28,30,36,.72); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--line-2);
  }
  #panel nav button {
    flex: 1; border: none; background: none; color: var(--text); height: 40px; padding: 0 6px; border-radius: 999px;
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  #panel nav button svg { width: 19px; height: 19px; flex-shrink: 0; }
  #panel nav button.active { background: #2A2C30; color: var(--blue-t); }

  /* ---- route tab ---- */
  #routePanel { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; right: 12px; z-index: 900; }
  #routePanel .row-in { display: flex; gap: 8px; }
  .search-wrap {
    flex: 1; display: flex; align-items: center; min-width: 0; height: 50px; border-radius: 999px;
    background: var(--sheet); border: 1px solid var(--line-2); box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .s-ico { width: 18px; height: 18px; color: var(--muted); margin-left: 16px; flex-shrink: 0; }
  #destInput { flex: 1; min-width: 0; height: 100%; font-size: 16px; padding: 0 10px; border: none; outline: none; background: transparent; }
  #destInput::placeholder { color: var(--muted); }
  #clearBtn { display: none; border: none; background: var(--s2); width: 24px; height: 24px; border-radius: 50%; font-size: 11px; margin-right: 13px; flex-shrink: 0; }
  .trip { position: relative; flex: 1; min-width: 0; padding-right: 48px; background: var(--sheet); border: 1px solid var(--line-2); border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .trip-row { display: flex; align-items: center; height: 46px; }
  .trip-sep { height: 1px; background: var(--line); margin-left: 38px; }
  .tdot { width: 10px; height: 10px; border-radius: 50%; margin: 0 2px 0 16px; flex-shrink: 0; }
  .tdot.o { border: 2.5px solid var(--blue-t); }
  .tdot.d { background: var(--red); }
  .trip input { flex: 1; min-width: 0; height: 100%; font-size: 16px; padding: 0 10px; border: none; outline: none; background: transparent; }
  .trip input::placeholder { color: var(--muted); }
  #origInput::placeholder { color: var(--blue-t); }
  .tclr { display: none; border: none; background: var(--s2); width: 22px; height: 22px; border-radius: 50%; font-size: 10px; flex-shrink: 0; margin-right: 4px; }
  #swapBtn { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--s1); display: flex; align-items: center; justify-content: center; }
  #swapBtn svg { width: 18px; height: 18px; }
  .sg-pin.me { color: var(--blue-t); }
  #routeBtn { height: 50px; padding: 0 20px; border-radius: 999px; border: none; background: var(--blue); color: #fff; font-size: 15px; font-weight: 700; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #suggest { display: none; margin-top: 8px; max-height: 52vh; overflow-y: auto; background: var(--sheet); border: 1px solid var(--line-2); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #suggest.open { display: block; }
  .sg { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .sg + .sg { border-top: 1px solid var(--line); }
  .sg-pin { width: 36px; height: 36px; border-radius: 12px; background: var(--s1); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .sg-pin svg { width: 16px; height: 16px; }
  .sg-txt { flex: 1; min-width: 0; }
  .sg-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-addr { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .sg-dist { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .sg-empty { padding: 16px; font-size: 14px; color: var(--muted); text-align: center; }
  #routeHint { display: none; }
  .note { font-size: 14px; color: var(--muted); }

  .toll-filter { margin: 0 0 10px; }
  .route-opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 14px; margin-bottom: 6px; border-radius: 16px; background: var(--s1); border: 1px solid transparent; cursor: pointer; }
  .route-opt.sel { border-color: var(--blue); background: #1E2540; }
  .ro-main { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 2px; min-width: 0; }
  .ro-main b { font-size: 15px; font-weight: 700; flex-basis: 100%; }
  .ro-sub { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .ro-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .mini { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--s2); }
  .mini.delay { color: var(--amber); }
  .mini.toll.yes { color: var(--yellow); }
  .ro-badges { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
  .cpcount { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .cpcount.cp-some { background: rgba(255,90,78,.14); color: var(--red); }
  .cpcount.cp-none { background: rgba(92,203,138,.13); color: var(--green); }
  .cpcount.inc-some { background: rgba(255,210,63,.13); color: var(--yellow); }
  .ro-listhead { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 0; }
  .route-hit { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
  .route-hit + .route-hit { border-top: 1px solid var(--line); }
  .route-hit .t { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; font-weight: 600; background: var(--s2); color: var(--muted); }
  .cat-tag { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-right: 6px; white-space: nowrap; }
  .cat-tag.cp { background: rgba(255,90,78,.14); color: var(--red); }
  .cat-tag.inc { background: rgba(255,210,63,.13); color: var(--yellow); }
  .nav-note { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
  #routeSummary .cta { margin-top: 10px; }
  .toll-filter { margin-bottom: 8px !important; }
  #routeSummary .cat-seg { margin-bottom: 8px; }
  .nav-row { display: grid; grid-template-columns: 1fr; }
  .nav-btn.g { composes: cta; }

  /* ---- report sheet (modal) ---- */
  #sheet { position: absolute; inset: 0; z-index: 1300; background: rgba(0,0,0,.5); display: none; align-items: flex-end; padding: 0 var(--panel-gap) calc(env(safe-area-inset-bottom) + var(--panel-gap)); }
  #sheet.open { display: flex; }
  #sheetBody { width: 100%; max-height: calc(100% - env(safe-area-inset-top) - 16px); display: flex; flex-direction: column; overflow: hidden; background: var(--sheet); border: 1px solid var(--line); border-radius: 34px; box-shadow: 0 -6px 30px rgba(0,0,0,.4); }

  #sheetBody h2 { font-size: 22px; font-weight: 700; }
  .sh-x { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--s1); font-size: 14px; }
  .steps { min-height: 0; overflow-y: auto; padding: 0 10px; display: flex; flex-direction: column; gap: 6px; }
  .step { border-radius: 20px; background: var(--s1); overflow: hidden; flex-shrink: 0; }
  .step-h { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; background: none; border: none; text-align: left; }
  .step-h:disabled { opacity: .4; }
  .step-n { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; background: var(--s2); color: var(--muted); }
  .step.open .step-n { background: var(--blue); color: #fff; }
  .step.done:not(.open) .step-n { background: var(--green); color: #0B2416; }
  .step-t { font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .step-s { flex: 1; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.open .step-s { display: none; }
  .step-b { display: none; }

  .step-b.pad, .step-b .pad { padding: 0 12px 12px; }
  #catSeg { background: var(--s2); padding: 3px; }

  .chips-grid, #typeChips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 0; }
  .chip { min-height: 38px; padding: 6px 8px; border-radius: 12px; border: none; background: var(--s2); font-size: 13.5px; font-weight: 400; line-height: 1.2; text-wrap: balance; }
  .chip.sel { background: var(--blue); color: #fff; font-weight: 600; }
  #pickWrap { position: relative; height: clamp(160px, calc(100dvh - 420px), 420px); margin: 0 10px; border-radius: 18px; overflow: hidden; }
  #pickHint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 1000; font-size: 13px; white-space: nowrap; color: #fff; background: rgba(20,22,30,.75); padding: 7px 13px; border-radius: 999px; pointer-events: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); z-index: 1000; pointer-events: none; font-size: 32px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)); }
  #labelInput { width: 100%; height: 44px; font-size: 16px; padding: 0 16px; border: none; border-radius: 999px; margin: 10px 0 0; background: var(--s2); outline: none; }
  #labelInput::placeholder { color: var(--muted); }
  #camWrap { position: relative; height: clamp(200px, calc(100dvh - 330px), 520px); margin: 0 10px 10px; border-radius: 18px; background: #000; overflow: hidden; }
  #camVideo, #camShot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camShot { display: none; }

  #camWrap.shot #camVideo, #camWrap.shot #shutter { display: none; }
  #camMsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
  #camWrap.err #camMsg { display: flex; }
  #camCheck { display: none; position: absolute; left: 10px; right: 108px; bottom: 10px; font-size: 14px; font-weight: 600; color: #fff; padding: 10px 14px; border-radius: 16px; line-height: 1.35; background: rgba(20,22,30,.78); }
  #camCheck.show { display: block; }
  #camCheck.bad { background: rgba(214,58,46,.92); }
  #camCheck.good { background: rgba(38,140,84,.92); }
  #shutter { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 68px; height: 68px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,.35); background-clip: padding-box; box-shadow: 0 2px 14px rgba(0,0,0,.5); }
  #shutter:active { transform: translateX(-50%) scale(.92); }
  #retake { display: none; position: absolute; right: 10px; bottom: 10px; font-size: 14px; font-weight: 600; color: #fff; border: none; border-radius: 999px; padding: 10px 16px; background: rgba(20,22,30,.78); }
  #camWrap.shot #retake { display: block; }
  .cam-note { position: absolute; left: 10px; top: 10px; right: 10px; width: fit-content; font-size: 12.5px; color: #fff; padding: 7px 12px; border-radius: 999px; background: rgba(20,22,30,.72); }
  .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; padding: 10px; flex-shrink: 0; }
  .sheet-actions .cancel, .sheet-actions .submit { height: 48px; border-radius: 999px; font-size: 16px; font-weight: 600; }
  .sheet-actions .cancel { border: 1px solid var(--line-2); background: none; }
  .sheet-actions .submit { border: none; background: var(--blue); color: #fff; }
  .sheet-actions .submit:disabled { opacity: .4; }

  #toast { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 124px); z-index: 1400; display: none; width: max-content; max-width: calc(100% - 32px); text-align: center; color: #fff; font-size: 14.5px; font-weight: 500; padding: 13px 20px; border-radius: 999px; background: rgba(40,44,58,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--line-2); box-shadow: 0 8px 26px rgba(0,0,0,.4); }

  /* ===== Wide screens: unfolded foldables, tablets, desktop ===== */
  @media (min-width: 700px) {
    body { max-width: none; }
    #panel:not(.full) .pv { touch-action: auto; overflow-y: auto; }
    #panel, #panel.full {
      left: 12px; right: auto; top: calc(env(safe-area-inset-top) + 12px); bottom: calc(env(safe-area-inset-bottom) + 12px);
      width: min(420px, 42vw); height: auto; max-height: none; border-radius: 30px;
    }
    .grab { display: none; }
    .pv { padding-top: 20px; }
    #panel .mapctl, #panel.full .mapctl { display: flex; position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 20px); top: auto; }
    .brand { left: calc(min(420px, 42vw) + 28px); }
    #routePanel { left: calc(min(420px, 42vw) + 28px); right: 16px; max-width: 620px; }
    #toast { left: calc(50% + min(420px, 42vw) / 2 + 6px); }
    #sheet { align-items: center; justify-content: center; padding: 24px; }
    #sheetBody { max-width: 560px; max-height: calc(100% - 48px); }
    #pickWrap { height: clamp(220px, calc(100dvh - 520px), 440px); }
    #camWrap { height: clamp(260px, calc(100dvh - 420px), 520px); }
  }

  @keyframes sheetUp { from { transform: translateY(105%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #sheet.open { animation: fadeIn .18s ease; }
  #sheet.open #sheetBody { animation: sheetUp .38s cubic-bezier(.32,.72,0,1); }
  @media (prefers-reduced-motion: reduce) { #sheet.open, #sheet.open #sheetBody { animation: none; } #panel { transition: none; } }

</head>
<body>

<main>
  <div class="tab active" id="tab-map">
    <div id="map"></div>
    <div class="brand"><i>ด</i><span>ด่าน</span><button id="langBtn" onclick="toggleLang()" aria-label="Switch language">EN</button></div>
  </div>

  <div class="tab" id="tab-route">
    <div id="routePanel">
      <div class="row-in">
        <div class="trip">
          <div class="trip-row"><i class="tdot o"></i>
            <input id="origInput" data-i18n-ph="origPh" autocomplete="off" enterkeyhint="search">
            <button class="tclr" id="origClear" aria-label="Clear" onclick="clearField('orig')">✕</button></div>
          <div class="trip-sep"></div>
          <div class="trip-row"><i class="tdot d"></i>
            <input id="destInput" data-i18n-ph="destPh" autocomplete="off" enterkeyhint="search">
            <button class="tclr" id="clearBtn" aria-label="Clear" onclick="clearField('dest')">✕</button></div>
          <button id="swapBtn" aria-label="Swap" onclick="swapTrip()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        </div>
      </div>
      <div id="suggest"></div>
      <div id="routeHint" data-i18n="routeHint"></div>
    </div>
    <div id="routeMap"></div>
  </div>

  <!-- Persistent bottom panel: nearby list / report detail / route options + tab bar -->
  <section id="panel">
    <div class="mapctl"><button onclick="recenter()" aria-label="My location"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg></button></div>
    <div class="grab" id="panelDrag"><div class="grabber"></div></div>
    <div class="pv on" id="pv-near">
      <div class="p-head">
        <div><h2 id="nearTitle"></h2><div class="p-sub" id="locBadge"></div></div>
        <div class="rec-legend">
          <span><i style="background:var(--fresh)"></i><span data-i18n="legFresh"></span></span>
          <span><i style="background:var(--aging)"></i><span data-i18n="legAging"></span></span>
          <span><i style="background:var(--stale)"></i><span data-i18n="legStale"></span></span>
        </div>
      </div>
      <div class="seg" id="catbar"></div>
      <div id="feedScroll" class="rows"></div>
    </div>
    <div class="pv" id="pv-detail"></div>
    <div class="pv" id="pv-route"><div id="routeSummary"></div></div>
    <nav>
      <button data-tab="map" class="active" onclick="switchTab('map')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg><span data-i18n="tabNear"></span></button>
      <button data-tab="route" onclick="switchTab('route')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19H14a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h5.8"/></svg><span data-i18n="tabRoute"></span></button>
      <button data-tab="report" onclick="switchTab('report')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="tabReport"></span></button>
    </nav>
  </section>

  <div id="sheet">
    <div id="sheetBody">
      <div class="drag-zone" id="sheetDrag"><div class="grabber"></div>
      <div class="sh-head"><h2 data-i18n="sheetTitle"></h2><button class="sh-x" onclick="closeSheet()" aria-label="Close">✕</button></div></div>
      <!-- Stepper (type → location → photo): one step open at a time; finished steps collapse to a ✓ summary and can be reopened. -->
      <div class="steps">
        <section class="step" data-step="type">
          <button class="step-h" onclick="goStep(0)"><span class="step-n">1</span><span class="step-t" data-i18n="st2"></span><span class="step-s" id="sum2"></span></button>
          <div class="step-b pad">
            <div class="seg" id="catSeg"></div>
            <div class="chips" id="typeChips"></div>
          </div>
        </section>
        <section class="step" data-step="where">
          <button class="step-h" onclick="goStep(1)"><span class="step-n">2</span><span class="step-t" data-i18n="st3"></span><span class="step-s" id="sum3"></span></button>
          <div class="step-b">
            <div id="pickWrap">
              <div id="pickMap"></div>
              <div id="crosshair">📍</div>
              <div id="pickHint" data-i18n="pickHint"></div>
            </div>
            <div class="pad"><input id="labelInput" data-i18n-ph="placePh"></div>
          </div>
        </section>
        <section class="step" data-step="photo">
          <button class="step-h" onclick="goStep(2)"><span class="step-n">3</span><span class="step-t" data-i18n="st1"></span><span class="step-s" id="sum1"></span></button>
          <div class="step-b">
            <div id="camWrap">
              <video id="camVideo" playsinline muted autoplay></video>
              <img id="camShot" alt="">
              <div id="camMsg"></div>
              <div id="camCheck"></div>
              <button id="shutter" onclick="capturePhoto()" aria-label="Take photo"></button>
              <button id="retake" onclick="startCamera()" data-i18n="retake"></button>
              <div class="cam-note" data-i18n="passengerNote"></div>
            </div>
          </div>
        </section>
      </div>
      <div class="sheet-actions">
        <button class="cancel" id="backBtn" onclick="stepBack()"></button>
        <button class="submit" id="nextBtn" onclick="stepNext()"></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</main>

const STYLE_URL = "https://tiles.openfreemap.org/styles/dark";

const PALETTE = {  // navy map, after JodNai
  background: "#2B3150", landuse_residential: "#2D3353", landcover_wood: "#23403A", landuse_park: "#23403A",
  water: "#1C2C8F", waterway: "#1C2C8F", building: "#353C5E",
  highway_path: "#394062", highway_minor: "#4A5277", highway_major_casing: "#3A4163", highway_major_inner: "#7C88B0",
  highway_major_subtle: "#7C88B0", highway_motorway_casing: "#3A4163", highway_motorway_inner: "#A6B1D3",
  highway_motorway_subtle: "#A6B1D3", railway_transit: "#454C6E", railway_minor: "#454C6E", railway: "#454C6E",
};
const baseMaps = [];

function tuneStyle(gl) {
  for (const [id, color] of Object.entries(PALETTE)) {
    const l = gl.getLayer(id); if (!l) continue;
    const prop = l.type === "background" ? "background-color" : l.type === "fill" ? "fill-color" : "line-color";
    gl.setPaintProperty(id, prop, color);
    if (l.type === "fill") gl.setPaintProperty(id, "fill-opacity", 1);
  }
  ["highway_minor", "highway_major_inner", "highway_motorway_inner"].forEach(id => gl.getLayer(id) && gl.setPaintProperty(id, "line-opacity", 1));
  gl.getStyle().layers.filter(l => l.type === "symbol").forEach(l => {
    if (!gl.getLayoutProperty(l.id, "text-field")) return;
    const major = l.id.startsWith("place_city") || l.id === "place_town";
    gl.setPaintProperty(l.id, "text-color", major ? "#EEF0F8" : l.id.startsWith("highway") ? "#B7BFD9" : "#CDD2E4");
    gl.setPaintProperty(l.id, "text-halo-color", "rgba(32,37,64,.92)");
    gl.setPaintProperty(l.id, "text-halo-width", 1.2);
  });
}
function setMapLabels(gl) {
  if (!gl || !gl.isStyleLoaded()) return;
  const field = lang === "en"
    ? ["coalesce", ["get", "name:en"], ["get", "name_en"], ["get", "name:latin"], ["get", "name"]]
    : ["coalesce", ["get", "name:th"], ["get", "name"]];
  gl.getStyle().layers.filter(l => l.type === "symbol").forEach(l => {
    if (gl.getLayoutProperty(l.id, "text-field")) gl.setLayoutProperty(l.id, "text-field", field);
  });
}
function addBasemap(lmap) {
  const layer = L.maplibreGL({ style: STYLE_URL, attribution: MAP_ATTR }).addTo(lmap);
  const gl = layer.getMaplibreMap();
  baseMaps.push(gl);
  gl.on("styleimagemissing", e => { // quiet missing pattern sprites
    if (!gl.hasImage(e.id)) gl.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
  });
  gl.on("load", () => { tuneStyle(gl); setMapLabels(gl); });
  return layer;
}

    () => { userLoc = DEFAULT_LOC; onLocated(false); },

function haversineM(a, b) {
  const R = 6371000, toR = Math.PI / 180;
  const dp = (b[0]-a[0])*toR, dl = (b[1]-a[1])*toR;
  const h = Math.sin(dp/2)**2 + Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

  if (onMap.getZoom() < COMPACT_BELOW_ZOOM && !big && cp.id !== selectedId) {

    return L.marker([cp.lat, cp.lng], { icon, zIndexOffset: cp.age_minutes <= 60 ? 500 : 0 }).on("click", () => openDetail(cp.id));
  }
  const cls = ["mk", inc ? "inc" : "cp", cp.age_minutes > 180 ? "stale" : "", big || cp.id === selectedId ? "sel" : ""].join(" ");
  const icon = L.divIcon({ className: "mk-wrap", iconSize: [0, 0],

  return L.marker([cp.lat, cp.lng], { icon, zIndexOffset: big || cp.id === selectedId ? 1000 : (cp.age_minutes <= 60 ? 500 : 0) })

async function shareReport(id) {
  const cp = checkpoints.find(c => c.id === id); if (!cp) return;
  const appUrl = `${location.origin}/?r=${cp.id}`;
  const text = `${typeName(cp.type)} · ${labelName(cp.label)} (${agoText(cp.age_minutes)})\nGoogle Maps: ${gmapsUrl(cp)}`;
  try {
    if (navigator.share) { await navigator.share({ title: t("shareTitle"), text, url: appUrl }); return; }
    await navigator.clipboard.writeText(`${text}\n${appUrl}`);

let staleOpen = false;
function renderFeed() {
  const withDist = checkpoints.filter(catShown).map(cp => ({ cp, dist: userLoc ? haversineM(userLoc, [cp.lat, cp.lng]) : null }));
  const active = withDist.filter(x => x.cp.status === "active").sort((a, b) => (a.dist ?? 0) - (b.dist ?? 0));
  const stale = withDist.filter(x => x.cp.status === "stale").sort((a, b) => a.cp.age_minutes - b.cp.age_minutes);
  $("nearTitle").textContent = t("nearTitle", active.length);
  let html = active.length ? active.map(x => rowHtml(x.cp, x.dist)).join("") : `<div class="empty">${t("noneNear")}</div>`;
  if (stale.length) {
    html += `<div class="more" onclick="staleOpen=!staleOpen;renderFeed()"><span>${t("staleHead", stale.length)}</span><span>${staleOpen ? "▲" : "▼"}</span></div>`;
    if (staleOpen) html += stale.map(x => rowHtml(x.cp, x.dist)).join("");
  }
  $("feedScroll").innerHTML = html;
  if (panelView === "near") updateCollapsed();
}

/* ---------- bottom panel: views (near / detail / route) and heights (mini / peek / full) ---------- */
let panelView = "near", prevView = "near", prevPanelState = "collapsed";
// Two states only: "collapsed" (default) and "full". Collapsed height is measured per view so it
// ends right below the useful header: Nearby → the filter; Route → the first route option.
function panelState() { return $("panel").classList.contains("full") ? "full" : "collapsed"; }
function updateCollapsed() {
  const p = $("panel"), pv = $("pv-" + panelView);
  if (!pv || panelView === "detail") return;
  let anchor = panelView === "near" ? $("catbar")
    : (document.querySelector("#routeSummary .route-opt") || $("routeSummary").lastElementChild);
  if (!anchor) return;
  const grab = $("panelDrag").offsetHeight, nav = p.querySelector("nav");
  const navH = nav.offsetHeight + parseFloat(getComputedStyle(nav).marginTop) + parseFloat(getComputedStyle(nav).marginBottom);
  const padTop = parseFloat(getComputedStyle(pv).paddingTop);
  const h = Math.round(grab + padTop + anchor.offsetTop + anchor.offsetHeight + 12 + navH + 2);
  p.style.setProperty("--collapsed", Math.min(h, window.innerHeight * 0.6) + "px");
}
function setPanel(st) {
  const p = $("panel");
  if (st === "detail") {               // fit the detail content exactly (no scrolling)
    p.classList.remove("full"); p.classList.add("fitdetail");
    const pv = $("pv-detail"), nav = p.querySelector("nav"), cs = getComputedStyle(nav);
    const h = $("panelDrag").offsetHeight + pv.scrollHeight + nav.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom) + 2;
    const max = window.innerHeight - 70;
    p.style.setProperty("--detail-h", Math.min(h, max) + "px");
    p.classList.toggle("dt-scroll", h > max);   // tiny screens: allow scrolling instead of clipping
    document.body.classList.remove("panel-full");
    return;
  }
  p.classList.remove("fitdetail", "dt-scroll");
  st = st === "full" ? "full" : "collapsed";
  if (panelView === "route" && !routeData.length) st = "collapsed"; // nothing to expand to
  p.classList.toggle("full", st === "full");
  updateCollapsed();
  document.body.classList.toggle("panel-full", st === "full");
}
function showView(v) {
  panelView = v;
  ["near", "detail", "route"].forEach(x => $("pv-" + x).classList.toggle("on", x === v));
  updateCollapsed();
  if (v !== "detail") $("panel").classList.remove("tint-cp", "tint-inc");
}
// Foldables unfolded / tablets: two-pane layout (panel on the left, map on the right).
const WIDE_MQ = window.matchMedia("(min-width: 700px)");
function isWide() { return WIDE_MQ.matches; }
WIDE_MQ.addEventListener("change", () => setTimeout(() => { map.invalidateSize(); routeMap.invalidateSize(); }, 50));
function activeMap() { return $("tab-route").classList.contains("active") ? routeMap : map; }
function recenter() { activeMap().setView(userLoc || DEFAULT_LOC, 15); }

}
function renderRouteEmpty() {
  $("routeSummary").innerHTML = `<div class="p-head"><div><h2>${t("routeTitle")}</h2><div class="p-sub">${t("routeHint")}</div></div>${recLegendHtml()}</div>${catSegHtml()}`;
}

// Drag the grabber: up = expand, down = shrink; tap toggles peek/full.
(function panelDrag() {
  const zone = $("panelDrag"), p = $("panel");
  let y0 = null, h0 = 0, moved = false;
  zone.addEventListener("pointerdown", e => { y0 = e.clientY; h0 = p.offsetHeight; moved = false; zone.setPointerCapture(e.pointerId); p.classList.add("dragging"); });
  zone.addEventListener("pointermove", e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; if (Math.abs(dy) > 4) moved = true;
    p.style.height = Math.max(150, Math.min(window.innerHeight - 80, h0 - dy)) + "px";
  });
  const end = e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    p.classList.remove("dragging"); p.style.height = "";
    const st = panelState();
    if (panelView === "detail") { if (!moved || dy > 40) closeDetail(); else setPanel("detail"); return; }
    if (!moved) return setPanel(st === "full" ? "collapsed" : "full");
    if (dy < -40) setPanel("full");
    else if (dy > 40) { if (st === "collapsed" && panelView === "route" && routeData.length) closeRoute(); else setPanel("collapsed"); }
  };
  zone.addEventListener("pointerup", end); zone.addEventListener("pointercancel", end);
})();

/* ---------- route tab ---------- */
function ptSegDistM(p, a, b) {
  const toR = Math.PI/180, latR = p[0]*toR;
  const mPerLat = 111320, mPerLng = 111320*Math.cos(latR);
  const px = (p[1]-a[1])*mPerLng, py = (p[0]-a[0])*mPerLat;
  const bx = (b[1]-a[1])*mPerLng, by = (b[0]-a[0])*mPerLat;
  const len2 = bx*bx + by*by;
  let tt = len2 ? (px*bx + py*by)/len2 : 0;
  tt = Math.max(0, Math.min(1, tt));
  const dx = px - tt*bx, dy = py - tt*by;
  return { d: Math.sqrt(dx*dx + dy*dy), t: tt };
}

function distToRoute(cp, coords) {
  let best = Infinity, along = 0, acc = 0;
  for (let i = 0; i < coords.length - 1; i++) {
    const segLen = haversineM(coords[i], coords[i+1]);
    const r = ptSegDistM([cp.lat, cp.lng], coords[i], coords[i+1]);
    if (r.d < best) { best = r.d; along = acc + r.t*segLen; }
    acc += segLen;
  }
  return { dist: best, along };
}

/* ---------- trip search: start (A) + destination (B), Google-Maps-style ----------
   tripOrig null = the user's live location; any other value is a chosen place, so users can
   preview trips from somewhere they aren't yet. Autocomplete via /api/search for either field. */
let suggestions = [], suggestTimer = null, suggestSeq = 0;
let tripOrig = null, tripDest = null, activeField = "dest", origMarker = null;
const PIN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const ME_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 2.9L13.4 21z"/></svg>';
const fieldEl = f => $(f === "orig" ? "origInput" : "destInput");
const clearEl = f => $(f === "orig" ? "origClear" : "clearBtn");

async function searchPlaces(q, final = false) {
  const c = (tripOrig && activeField === "dest") ? [tripOrig.lat, tripOrig.lng] : (userLoc || DEFAULT_LOC);
  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&lat=${c[0]}&lng=${c[1]}&lang=${lang}${final ? "&final=1" : ""}`);
  return res.ok ? (await res.json()).results || [] : [];
}
function renderSuggest(q, submitted = false) {
  const el = $("suggest");
  const meRow = activeField === "orig" ? `<div class="sg" onmousedown="event.preventDefault()" onclick="pickMyLoc()">
      <div class="sg-pin me">${ME_SVG}</div><div class="sg-txt"><div class="sg-name">${t("myLoc")}</div></div></div>` : "";
  if (!q || q.length < 2) {
    if (meRow) { el.innerHTML = meRow; el.classList.add("open"); } else el.classList.remove("open");
    return;
  }
  el.innerHTML = meRow + (suggestions.length
    ? suggestions.map((r, i) => `<div class="sg" onmousedown="event.preventDefault()" onclick="pickPlace(${i})">
        <div class="sg-pin">${PIN_SVG}</div>
        <div class="sg-txt"><div class="sg-name">${esc(r.name)}</div>${r.address ? `<div class="sg-addr">${esc(r.address)}</div>` : ""}</div>
        ${r.dist_m != null ? `<div class="sg-dist">${distText(r.dist_m)}</div>` : ""}
      </div>`).join("")
    : (submitted ? `<div class="sg-empty">${t("noResults")}</div>`
      : `<div class="sg" onmousedown="event.preventDefault()" onclick="submitSearch()">
          <div class="sg-pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
          <div class="sg-txt"><div class="sg-name">${t("searchFor", esc(q))}</div></div></div>`));
  el.classList.add("open");
}
function onSearchInput(f) {
  activeField = f;
  if (f === "orig") tripOrig = null; else tripDest = null;
  const q = fieldEl(f).value.trim();
  clearEl(f).style.display = q ? "block" : "none";
  clearTimeout(suggestTimer);
  if (q.length < 2) { suggestions = []; renderSuggest(""); return; }
  suggestTimer = setTimeout(async () => {
    const seq = ++suggestSeq;
    const res = await searchPlaces(q).catch(() => []);
    if (seq !== suggestSeq) return; // a newer keystroke won
    suggestions = res;
    renderSuggest(q);
  }, 280);
}
function closeSuggest() { $("suggest").classList.remove("open"); }
function syncTripUI() {
  $("origInput").value = tripOrig ? tripOrig.name : ($("origInput") === document.activeElement ? $("origInput").value : "");
  $("destInput").value = tripDest ? tripDest.name : $("destInput").value;
  ["orig", "dest"].forEach(f => clearEl(f).style.display = fieldEl(f).value ? "block" : "none");
  if (destMarker) { destMarker.remove(); destMarker = null; }
  if (origMarker) { origMarker.remove(); origMarker = null; }
  if (tripDest) destMarker = L.marker([tripDest.lat, tripDest.lng]).addTo(routeMap);
  if (tripOrig) origMarker = L.circleMarker([tripOrig.lat, tripOrig.lng], { radius: 8, color: "#fff", weight: 3, fillColor: "#7EA3FF", fillOpacity: 1 }).addTo(routeMap);
}
// After either end changes: route if both are known, else move the cursor to the missing one.
function tripChanged() {
  syncTripUI(); closeSuggest(); suggestions = [];
  if (tripDest) { document.activeElement && document.activeElement.blur(); buildRoute(); }
  else { activeField = "dest"; $("destInput").focus(); }
}
function setTripEnd(f, place) { if (f === "orig") tripOrig = place; else tripDest = place; tripChanged(); }
function pickPlace(i) {
  const r = suggestions[i]; if (!r) return;
  setTripEnd(activeField, { lat: r.lat, lng: r.lng, name: r.name });
}
function pickMyLoc() { $("origInput").value = ""; setTripEnd("orig", null); }
async function submitSearch() {
  const f = activeField, q = fieldEl(f).value.trim();
  if (!q) { if (f === "orig") return pickMyLoc(); return toast(t("needDest")); }
  clearTimeout(suggestTimer);
  if (!suggestions.length) {
    const seq = ++suggestSeq;
    suggestions = await searchPlaces(q, true).catch(() => []);
    if (seq !== suggestSeq) return;
  }
  if (!suggestions.length) { renderSuggest(q, true); return; }
  pickPlace(0);
}
function clearField(f) {
  fieldEl(f).value = ""; suggestions = [];
  if (f === "orig") { tripOrig = null; syncTripUI(); if (tripDest && routeData.length) buildRoute(); }
  else { tripDest = null; syncTripUI(); }
  activeField = f; fieldEl(f).focus(); renderSuggest("");
}
function swapTrip() {
  const me = () => { const c = userLoc || DEFAULT_LOC; return { lat: c[0], lng: c[1], name: t("myLoc"), me: true }; };
  const o = tripOrig || me(), d = tripDest;
  if (!d) return toast(t("needDest"));
  tripOrig = d.me ? null : d; tripDest = o;
  $("destInput").value = ""; $("origInput").value = "";
  tripChanged();
}

// Route options come from our backend (/api/routes), which asks the routing engine for its
// normal options with tolls allowed AND with tolls avoided, then orders them by travel time.
// Each: {coords:[[lat,lng]...], km, mins, toll: true|false|null}. Checkpoints never affect
// which routes are returned or their order — we only count what lies on each one.
async function fetchRoutes(o, dest) {
  const q = `olat=${o[0]}&olng=${o[1]}&dlat=${dest.lat}&dlng=${dest.lng}`;
  const res = await fetch(`/api/routes?${q}`);
  if (!res.ok) throw new Error("routing");
  return await res.json();
}

async function buildRoute() {
  if (!tripDest) { activeField = "dest"; return submitSearch(); }
  const o = tripOrig ? [tripOrig.lat, tripOrig.lng] : (userLoc || DEFAULT_LOC);
  const destLatLng = L.latLng(tripDest.lat, tripDest.lng);
  toast(t("calcRoute"));
  let raw;
  try { const js = await fetchRoutes(o, destLatLng); raw = js.routes || []; routeTraffic = !!js.traffic; }
  catch { return toast(t("routeErr")); }
  if (!raw.length) return toast(t("noRoute"));

  // Routes come from the engine in its own order (by travel time). We annotate each
  // with the checkpoints that fall on it — we never reorder by checkpoint count or
  // feed checkpoints into the routing itself.
  const active = checkpoints.filter(c => c.status === "active");
  routeData = raw.map(rt => {
    const hits = [];
    active.forEach(cp => {
      const r = distToRoute(cp, rt.coords);
      if (r.dist <= ROUTE_BUFFER_M) hits.push({ cp, along: r.along });
    });
    hits.sort((a, b) => a.along - b.along);
    return { coords: rt.coords, hits, km: rt.km, mins: rt.mins, toll: rt.toll, delay: rt.delay_mins || 0 };
  });
  selRoute = 0;
  lastDest = { lat: tripDest.lat, lng: tripDest.lng };
  lastOrig = tripOrig ? { lat: tripOrig.lat, lng: tripOrig.lng } : null;
  drawRoutes();
  renderRouteSummary();
  showView("route"); setPanel("collapsed");
  setTimeout(() => {
    routeMap.invalidateSize();
    const b = L.latLngBounds(routeData.flatMap(r => r.coords));
    routeMap.fitBounds(b, isWide()
      ? { paddingTopLeft: [$("panel").offsetWidth + 40, 130], paddingBottomRight: [40, 40] }
      : { paddingTopLeft: [30, 130], paddingBottomRight: [30, $("panel").offsetHeight + 30] });
  }, 380);
}

function closeRoute() {
  routeData = []; selRoute = 0; lastDest = null; lastOrig = null;
  routeLines.clearLayers();
  tripOrig = null; tripDest = null; $("origInput").value = ""; $("destInput").value = ""; syncTripUI();
  renderRouteEmpty(); setPanel("collapsed");
  suggestions = []; closeSuggest(); activeField = "dest";
  renderRouteCps();
  if (userLoc) routeMap.setView(userLoc, 12);
}

function drawRoutes() {
  routeLines.clearLayers();
  // Draw unselected first so the selected route sits on top.
  routeData.forEach((r, i) => {
    if (i === selRoute || !routeMatches(r)) return;
    L.polyline(r.coords, { color: "#5A5A62", weight: 4, opacity: .6 })
      .on("click", () => { selRoute = i; drawRoutes(); renderRouteSummary(); })
      .addTo(routeLines);
  });
  const sel = routeData[selRoute];
  L.polyline(sel.coords, { color: "#0A84FF", weight: 6, opacity: .95 }).addTo(routeLines);

  renderRouteCps();
}

// Every report is shown on the route map (per the category filter); ones on the selected route are drawn larger.
function renderRouteCps() {
  routeCpLayer.clearLayers();
  const onSel = new Set(routeData.length ? routeData[selRoute].hits.map(h => h.cp.id) : []);
  checkpoints.filter(cp => catShown(cp) || onSel.has(cp.id)).forEach(cp => {
    makeMarker(cp, onSel.has(cp.id), routeMap).addTo(routeCpLayer);
  });
}

function renderRouteSummary() {
  const sum = $("routeSummary");
  // Toll filter only narrows the list; routes always stay in travel-time order.
  const visible = routeData.map((r, i) => i).filter(i => routeMatches(routeData[i]));
  if (visible.length && !visible.includes(selRoute)) { selRoute = visible[0]; drawRoutes(); }
  const hasTollInfo = routeData.some(r => r.toll != null);
  const filterBar = hasTollInfo ? `<div class="seg toll-filter">${["all", "toll", "noToll"].map(k =>
      `<button class="${tollFilter === k ? "on" : ""}" onclick="setTollFilter('${k}')">${t("f_" + k)}</button>`).join("")}</div>` : "";
  const opts = visible.length ? visible.map(i => {
    const r = routeData[i];
    const n = r.hits.filter(h => catOf(h.cp) === "checkpoint").length;
    const ni = r.hits.length - n;
    return `<div class="route-opt ${i === selRoute ? "sel" : ""}" onclick="selRoute=${i};drawRoutes();renderRouteSummary()">
        <div class="ro-main">
          <b>${t("routeN", i + 1)}</b>
          <span class="ro-sub">${t("minKm", r.mins, r.km.toFixed(1))}</span>
          ${(r.delay > 0 || r.toll != null) ? `<span class="ro-tags">${r.delay > 0 ? `<span class="mini delay">${t("delay", r.delay)}</span>` : ""}${r.toll == null ? "" : `<span class="mini toll ${r.toll ? "yes" : "no"}">${t(r.toll ? "toll" : "noToll")}</span>`}</span>` : ""}
        </div>
        <div class="ro-badges">${catFilter !== "incident" ? `<span class="cpcount ${n ? "cp-some" : "cp-none"}">${n ? t("cpN", n) : t("cpNone")}</span>` : ""}${catFilter !== "checkpoint" && ni ? `<span class="cpcount inc-some">${t("incN", ni)}</span>` : ""}</div>
      </div>`;
  }).join("") : `<div class="route-hit" style="color:var(--muted)">${t("noRouteFilter")}</div>`;

  const sel = routeData[selRoute];
  const shownHits = sel.hits.filter(h => catShown(h.cp));
  const list = shownHits.length
    ? shownHits.map(h => `<div class="route-hit">
          <div><b>${esc(labelName(h.cp.label))}</b><div class="t">${catTag(h.cp)}<span class="nw">${esc(typeName(h.cp.type))}</span> · <span class="nw">${t("lastConfirmed", agoText(h.cp.age_minutes))}</span></div></div>
          <span class="badge dist">${t("kmAt", (h.along / 1000).toFixed(1))}</span>
        </div>`).join("")
    : `<div class="route-hit" style="color:var(--muted)">${t("noCpOnRoute")}</div>`;

  // Hand off to Google/Apple Maps for turn-by-turn; the nav app starts from live GPS.
  // Google: the CHECKPOINTS on the selected route (never incidents) are added as stops, in
  // driving order, so navigation passes through them. Max 3 — the mobile-app limit for URL
  // stops. A route with no checkpoints sends the destination only and Google picks its own way.
  // Apple Maps URLs don't support stops, so Apple always gets the destination only.
  const cpStops = sel.hits.filter(h => catOf(h.cp) === "checkpoint").slice(0, MAX_NAV_STOPS);
  const gWaypoints = cpStops.length
    ? "&waypoints=" + cpStops.map(h => `${h.cp.lat.toFixed(6)},${h.cp.lng.toFixed(6)}`).join("%7C") : "";
  const navBtns = lastDest ? `<div class="ro-listhead">${t("navWith")}</div>
    <div class="nav-note">${cpStops.length ? t("navNoteStops", cpStops.length) : t("navNote")}</div>
    <div class="nav-row">
      <a class="cta" href="https://www.google.com/maps/dir/?api=1${lastOrig ? `&origin=${lastOrig.lat},${lastOrig.lng}` : ""}&destination=${lastDest.lat},${lastDest.lng}${gWaypoints}&travelmode=driving" target="_blank" rel="noopener">${ICON_GO}${t("openG")}</a>
      <a class="btn-outline" href="https://maps.apple.com/?${lastOrig ? `saddr=${lastOrig.lat},${lastOrig.lng}&` : ""}daddr=${lastDest.lat},${lastDest.lng}&dirflg=d" target="_blank" rel="noopener">${t("openA")}</a>
    </div>` : "";

  sum.innerHTML = `<div class="p-head"><div><h2>${t("chooseRoute")}</h2><div class="p-sub">${t("byTime")} · ${t(routeTraffic ? "liveTraffic" : "noTraffic")}</div></div>${recLegendHtml()}
      <button class="ibtn" onclick="closeRoute()" aria-label="${t("closeRoute")}">✕</button></div>
    ${catSegHtml()}
    ${filterBar}
    ${opts}
    <div class="ro-listhead">${t("onRoute", selRoute + 1)}</div>
    ${list}
    ${navBtns}`;
  if (panelView === "route") updateCollapsed();
}

/* ---------- report sheet ----------
   Anti-spam: live camera only (no file upload), reporter's live GPS must be near the pin,
   server rate-limits and (if configured) has Claude check the photo shows a checkpoint.
   The photo is only used for that check and is never stored. */
let camStream = null, photoData = null, reportPos = null, photoOk = false, photoProbs = undefined;

/* On-device photo check: MobileCLIP-S0 (Apple, open weights) via transformers.js, zero server cost.
   The model compares the photo with short text descriptions grouped by report kind; the text side was computed offline and
   ships as /static/clip_labels.json, so only the ~23 MB image model downloads (once, then cached).
   Pass rule: the photo must look like a road event at all (1 - P(neg) >= 0.5) AND the selected
   type must be plausible (P(type group) >= 0.15). On 47 sample photos: 34/36 real reports passed,
   all food/room/selfie photos were rejected. */
const CLIP_MODEL = "Xenova/mobileclip_s0";
const CLIP_EVENT_MIN = 0.5, CLIP_TYPE_MIN = 0.15, CLIP_AUTODETECT = 0.6;
let clipReady = null;
function loadClip() {
  if (!clipReady) clipReady = (async () => {
    const T = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2");
    T.env.allowLocalModels = false;
    const [processor, model, labels] = await Promise.all([
      T.AutoProcessor.from_pretrained(CLIP_MODEL),
      T.CLIPVisionModelWithProjection.from_pretrained(CLIP_MODEL, { dtype: "fp16", device: "wasm" }),
      fetch("/static/clip_labels.json").then(r => r.json()),
    ]);
    return { T, processor, model, labels };
  })().catch(e => { clipReady = null; throw e; });
  return clipReady;
}
// Returns {group: probability} over the label groups (checkpoint, accident, roadwork, flood,
// blocked, neg), or null if the model can't run.
async function photoScores(canvas) {
  try {
    const { T, processor, model, labels } = await loadClip();
    const img = await T.RawImage.fromCanvas(canvas);
    const { image_embeds } = await model(await processor(img));
    const v = image_embeds.normalize().tolist()[0];
    const logits = labels.embeds.map(e => 100 * e.reduce((s, x, i) => s + x * v[i], 0));
    const m = Math.max(...logits), ex = logits.map(l => Math.exp(l - m)), z = ex.reduce((a, b) => a + b);
    const out = {};
    labels.groups.forEach((g, i) => { out[g] = (out[g] || 0) + ex[i] / z; });
    return out;
  } catch (e) {
    console.warn("photo check unavailable", e);
    return null;
  }
}

function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(tr => tr.stop()); camStream = null; }
}
async function startCamera() {
  const wrap = $("camWrap");
  photoData = null; photoOk = false; photoProbs = undefined; wrap.classList.remove("shot", "err"); $("camCheck").className = ""; updateSubmit();
  stopCamera();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false,
    });
    $("camVideo").srcObject = camStream;
  } catch (e) {
    $("camMsg").textContent = t("camErr");
    wrap.classList.add("err");
  }
}
async function capturePhoto() {
  const v = $("camVideo");
  if (!camStream || !v.videoWidth) return;
  const scale = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  photoData = c.toDataURL("image/jpeg", 0.75);
  $("camShot").src = photoData;
  $("camWrap").classList.add("shot");
  stopCamera();
  const chk = $("camCheck");
  chk.textContent = t("checking"); chk.className = "show";
  updateSubmit();
  const shot = photoData;
  const probs = await photoScores(c);
  if (shot !== photoData) return; // retaken meanwhile
  photoProbs = probs;
  // Auto-pick the type when the photo clearly shows one kind of report.
  let detected = null;
  if (probs) {
    const best = Object.entries(probs).filter(([g]) => g !== "neg").sort((a, b) => b[1] - a[1])[0];
    if (best && best[1] >= CLIP_AUTODETECT && TYPES[selType].g !== best[0]) {
      selType = TYPE_KEYS.find(k => TYPES[k].g === best[0]);
      reportCat = TYPES[selType].cat;
      renderChips();
      detected = typeName(selType);
    }
  }
  evalPhoto(detected);
}
// Re-checks the stored photo scores against the currently selected type.
function evalPhoto(detected) {
  const chk = $("camCheck");
  if (!photoData || photoProbs === undefined) return;
  // Fail open if the model couldn't load (old phone / offline) — GPS + rate limits still apply.
  if (photoProbs === null) { photoOk = true; chk.className = ""; updateSubmit(); return; }
  photoOk = (1 - (photoProbs.neg || 0)) >= CLIP_EVENT_MIN && (photoProbs[TYPES[selType].g] || 0) >= CLIP_TYPE_MIN;
  chk.textContent = photoOk ? (detected ? t("detected", detected) : t("photoOk")) : t("photoBad");
  chk.className = "show " + (photoOk ? "good" : "bad");
  updateSubmit();
}
/* Report stepper: 1 type → 2 location → 3 photo → send. */
const STEPS = ["type", "where", "photo"];
let step = 0, maxStep = 0;
function updateSubmit() { renderSteps(); }
function renderSteps() {
  const last = STEPS.length - 1;
  document.querySelectorAll(".step").forEach(el => {
    const i = STEPS.indexOf(el.dataset.step);
    el.classList.toggle("open", i === step);
    el.classList.toggle("done", i < maxStep || (el.dataset.step === "photo" && photoOk));
    el.querySelector(".step-h").disabled = i > maxStep;
  });
  $("sum1").textContent = photoData && photoOk ? "✓ " + t("photoDone") : "";
  $("sum2").textContent = (maxStep > STEPS.indexOf("type") ? "✓ " : "") + typeName(selType);
  $("sum3").textContent = reportPos && pickMap ? t("fromYou", distText(haversineM(reportPos, [pickMap.getCenter().lat, pickMap.getCenter().lng]))) : "";
  $("backBtn").textContent = step === 0 ? t("cancel") : t("back");
  $("nextBtn").textContent = step === last ? "＋ " + t("submit") : t("next");
  $("nextBtn").disabled = STEPS[step] === "photo" ? !(photoData && photoOk) : false;
}
function goStep(i) {
  if (i > maxStep) return;
  step = i;
  renderSteps();
  const name = STEPS[i];
  if (name === "photo" && !photoData && !camStream) startCamera();
  if (name !== "photo" && camStream && !photoData) stopCamera(); // camera only runs on the photo step
  if (name === "where" && pickMap) setTimeout(() => { pickMap.invalidateSize(); renderSteps(); }, 60);
}
function stepNext() {
  if (STEPS[step] === "photo") {
    if (!(photoData && photoOk)) return toast(t(photoData ? "photoBad" : "needPhoto"));
    return submitReport();
  }
  maxStep = Math.max(maxStep, step + 1);
  goStep(step + 1);
}
function stepBack() { step === 0 ? closeSheet() : goStep(step - 1); }

function openSheet() {
  $("sheet").classList.add("open");
  step = 0; maxStep = 0;
  if (!pickMap) {
    pickMap = L.map("pickMap", { zoomControl: false }).setView(userLoc || DEFAULT_LOC, 16);
    addBasemap(pickMap);
    pickMap.on("moveend", renderSteps);
  } else {
    pickMap.setView(userLoc || DEFAULT_LOC, 16);
  }
  setTimeout(() => pickMap.invalidateSize(), 150);
  photoData = null; photoOk = false; photoProbs = undefined; $("camWrap").classList.remove("shot", "err"); $("camCheck").className = "";
  renderChips();
  renderSteps();
  loadClip().catch(() => {}); // warm up the model while the user aims
  // Fresh high-accuracy fix: the pin starts here and the server checks the pin is near it.
  reportPos = null;
  navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => { reportPos = [p.coords.latitude, p.coords.longitude]; pickMap.setView(reportPos, 17); renderSteps(); },
    () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}
/* Drag the grabber/title down to close; tap the dimmed backdrop to close. Drags that start inside
   the map or camera are not captured, so moving the map never closes the sheet. */
(function sheetDrag() {
  const body = $("sheetBody"), zone = $("sheetDrag");
  let y0 = null, t0 = 0, dy = 0;
  zone.addEventListener("pointerdown", e => {
    if (e.target.closest(".sh-x")) return;
    y0 = e.clientY; t0 = performance.now(); dy = 0;
    zone.setPointerCapture(e.pointerId);
    body.classList.add("dragging"); body.classList.remove("snap");
  });
  zone.addEventListener("pointermove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    body.style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, performance.now() - t0); // px per ms
    y0 = null;
    body.classList.remove("dragging"); body.classList.add("snap");
    if (dy > body.offsetHeight * 0.25 || v > 0.6) {
      body.style.transform = "translateY(100%)";
      setTimeout(() => { closeSheet(); body.classList.remove("snap"); body.style.transform = ""; }, 230);
    } else {
      body.style.transform = "";
    }
  };
  zone.addEventListener("pointerup", end);
  zone.addEventListener("pointercancel", end);
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });
})();

function closeSheet() {
  $("sheet").classList.remove("open");
  stopCamera(); photoData = null; photoOk = false; photoProbs = undefined; $("camWrap").classList.remove("shot", "err"); $("camCheck").className = "";
}

async function submitReport() {
  if (!photoData) return toast(t("needPhoto"));
  if (!photoOk) return toast(t("photoBad"));
  if (!reportPos) return toast(t("needGps"));
  const c = pickMap.getCenter();
  $("nextBtn").disabled = true;
  toast(t("verifying"));
  let res, js = {};
  try {
    res = await fetch("/api/checkpoints", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        lat: c.lat, lng: c.lng, type: selType, label: $("labelInput").value,
        user_lat: reportPos[0], user_lng: reportPos[1],
      })
    });
    js = await res.json();
  } catch (e) { updateSubmit(); return toast(t("sendErr")); }
  if (!res.ok || !js.ok) {
    updateSubmit();
    const msg = { need_gps: "needGps", too_far: "tooFar", rate_limited: "rateLimited" }[js.error];
    return toast(t(msg || "sendErr"));
  }
  closeSheet();
  $("labelInput").value = "";
  toast(js.merged ? t("merged") : t("sent"));
  loadCheckpoints();
}

function toast(msg) {
  const el = $("toast");
  el.textContent = msg; el.style.display = "block";
  clearTimeout(el._h);
  el._h = setTimeout(() => el.style.display = "none", 2600);
}

function switchTab(name) {
  if (name === "report") return openSheet();
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.id === "tab-" + name));
  document.querySelectorAll("#panel nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  selectedId = null;
  if (name === "map") { showView("near"); setPanel("collapsed"); }
  if (name === "route") {
    showView("route");
    if (routeData.length) { renderRouteSummary(); setPanel("collapsed"); } else { renderRouteEmpty(); setPanel("collapsed"); }
  }
  setTimeout(() => {
    if (name === "map") map.invalidateSize();
    if (name === "route") routeMap.invalidateSize();
  }, 60);
}

function renderChips() {
  $("catSeg").innerHTML = ["checkpoint", "incident"].map(c =>
    `<button class="${reportCat === c ? "on" : ""}" onclick="setReportCat('${c}')">${t("c_" + c)}</button>`).join("");
  $("typeChips").innerHTML = TYPE_KEYS.map((k, i) => TYPES[k].cat !== reportCat ? "" :
    `<button class="chip ${k === selType ? "sel" : ""}" onclick="pickType(${i})">${esc(typeName(k))}</button>`).join("");
}
function setReportCat(c) {
  reportCat = c;
  if (TYPES[selType].cat !== c) selType = TYPE_KEYS.find(k => TYPES[k].cat === c);
  renderChips(); evalPhoto();
}
function pickType(i) { selType = TYPE_KEYS[i]; renderChips(); evalPhoto(); }
["orig", "dest"].forEach(f => {
  const el = fieldEl(f);
  el.addEventListener("input", () => onSearchInput(f));
  el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); activeField = f; submitSearch(); } });
  el.addEventListener("focus", () => {
    if (activeField !== f) suggestions = [];
    activeField = f; renderSuggest(el.value.trim());
  });
  el.addEventListener("blur", () => setTimeout(() => { if (!document.activeElement || !document.activeElement.closest(".trip")) { closeSuggest(); if (activeField === "orig" && !tripOrig) setTimeout(() => { activeField = "dest"; }, 300); } }, 150));
});

/* ---------- Drag the sheet from its content, not just the grabber ----------
   When the content is scrolled to the top, a downward drag moves the sheet instead of scrolling
   (bottom panel shrinks; report sheet closes). While the panel isn't full height, an upward drag
   expands it. Drags that start on maps, the camera, inputs or segmented controls, sideways swipes,
   and drags in content that's scrolled down keep their normal behaviour. */
function contentDrag(el, o) {
  let sx = 0, sy = 0, t0 = 0, mode = null;
  el.addEventListener("touchstart", e => {
    mode = null;
    if (e.touches.length !== 1 || !o.enabled() || e.target.closest(".leaflet-container, #camWrap, input, textarea, .seg")) { mode = "skip"; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; t0 = performance.now();
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (mode === "skip") return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (mode === null) {
      const dx = x - sx, dy = y - sy;
      if (dx === 0 && dy === 0) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.5) { mode = "skip"; return; }
      const locked = o.locked && o.locked(); // content can't scroll in this state: every vertical drag moves the sheet
      if (locked || (dy > 0 && el.scrollTop <= 0) || (dy < 0 && o.allowUp && o.allowUp())) mode = "drag";
      else { mode = "skip"; return; }
      t0 = performance.now(); o.begin();
    }
    e.preventDefault();
    o.move(y - sy);
  }, { passive: false });
  const finish = e => {
    if (mode === "drag") {
      const dy = e.changedTouches[0].clientY - sy;
      o.end(dy, dy / Math.max(1, performance.now() - t0));
    }
    mode = null;
  };
  el.addEventListener("touchend", finish);
  el.addEventListener("touchcancel", finish);
}

// Bottom panel: same height snapping as the grabber.
let panelH0 = 0;
const panelDragOpts = {
  enabled: () => !isWide(),
  locked: () => panelView === "detail" ? !$("panel").classList.contains("dt-scroll") : panelState() !== "full",
  allowUp: () => panelState() !== "full" && !(panelView === "route" && !routeData.length),
  begin: () => { panelH0 = $("panel").offsetHeight; $("panel").classList.add("dragging"); },
  move: dy => { $("panel").style.height = Math.max(150, Math.min(window.innerHeight - 80, panelH0 - dy)) + "px"; },
  end: (dy, v) => {
    const p = $("panel"); p.classList.remove("dragging"); p.style.height = "";
    const st = panelState();
    if (panelView === "detail") { if (dy > 40 || v > 0.5) closeDetail(); else setPanel("detail"); return; }
    if (dy < -40 || v < -0.5) setPanel("full");
    else if (dy > 40 || v > 0.5) { if (st === "collapsed" && panelView === "route" && routeData.length) closeRoute(); else setPanel("collapsed"); }
  },
};
document.querySelectorAll("#panel .pv").forEach(el => contentDrag(el, panelDragOpts));

// Report sheet: drag down from the top of its content to close.
contentDrag(document.querySelector("#sheetBody .steps"), {
  enabled: () => true,
  begin: () => { const b = $("sheetBody"); b.classList.add("dragging"); b.classList.remove("snap"); },
  move: dy => { $("sheetBody").style.transform = `translateY(${Math.max(0, dy)}px)`; },
  end: (dy, v) => {
    const b = $("sheetBody");
    b.classList.remove("dragging"); b.classList.add("snap");
    if (dy > b.offsetHeight * 0.25 || v > 0.6) {
      b.style.transform = "translateY(100%)";
      setTimeout(() => { closeSheet(); b.classList.remove("snap"); b.style.transform = ""; }, 230);
    } else b.style.transform = "";
  },
});

initMaps();
applyLang();
locate();
loadCheckpoints();
setInterval(loadCheckpoints, 60000);
</script>
